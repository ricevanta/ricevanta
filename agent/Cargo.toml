[workspace]
members = ["crates/spool", "crates/batch", "crates/json", "crates/config", "crates/os", "crates/os-linux", "crates/os-macos", "crates/os-windows"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
crc32c = "=0.6.8"
libc = { version = "=0.2.189", default-features = false }
windows-sys = "=0.61.2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
