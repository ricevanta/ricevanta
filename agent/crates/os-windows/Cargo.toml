[package]
name = "ricevanta-os-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ricevanta-os = { path = "../os", version = "=0.1.0" }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

# Native bindings live here under spec section 1.1: unsafe is denied, not
# forbidden, and each unsafe block sits in a private function carrying
# `#[expect(unsafe_code, reason = "...")]` and a `// SAFETY:` comment.
[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
