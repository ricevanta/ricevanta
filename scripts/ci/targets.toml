  { parent = "TestRustWriterCaptureOverflow/stderr", Helper = "TestRustWriterCaptureChild", Pipe = "stderr", Outcome = "overflow" },
]

# Exact ordinary-suite skips: helper entry points that run only as children of a
# named parent test and tests that a separate selected unit proves. No wildcard
# allowance exists; check_policy.py pins every row.
