# Exact selected-execution inventory consumed by scripts/ci/run_selected.py.
# Each [[fuzz]] row is the go-fuzz:<package>:<target> ID; [loader] is loader-fuzz.
# [[selected]] rows name every other wrapper ID; fuzz_inventory = true makes an
# ordinary suite cross-check discovered Fuzz* names against [[fuzz]] and [loader].
# [[skips]] is the closed ordinary-suite allowance: each row names either a
# separate proving ID outside its own modes (proof) or the parent test in the
# same package that must pass in the same run (parent). A Rust row also names
# the test harness (target) that must report the ignore.

