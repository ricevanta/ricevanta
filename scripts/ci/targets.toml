subtests = ["TestRustWriterCaptureOverflow/stdout", "TestRustWriterCaptureOverflow/stderr"]
subtest_prefixes = ["TestRustWriterFixtures/body/", "TestRustWriterFixtures/header/", "TestRustWriterFixtures/descriptor/"]
children = [
