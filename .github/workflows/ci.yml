name: CI
'on':
  push:
    branches:
    - master
  pull_request:
    branches:
    - master
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
    - edited
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  route:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      route: ${{ steps.route.outputs.route }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Bootstrap admitted toolchains
      shell: bash
      working-directory: .
      env:
        CI_PLATFORM: linux-x64
        CI_TOOLS: python
      run: python3 -B scripts/ci/bootstrap.py --lock scripts/ci/toolchains.lock.json --platform "$CI_PLATFORM" --tools "$CI_TOOLS" --dest "$RUNNER_TEMP/admitted" --cache-mode none --env-out "$RUNNER_TEMP/tools.env"
    - name: Apply admitted toolchain environment
      shell: bash
      working-directory: .
      run: cat "$RUNNER_TEMP/tools.env" >> "$GITHUB_ENV"
    - name: Verify admitted toolchain evidence
      shell: bash
      working-directory: .
      env:
        CI_PLATFORM: linux-x64
        CI_TOOLS: python
      run: python3 -B scripts/ci/bootstrap/controls.py evidence --lock scripts/ci/toolchains.lock.json --platform "$CI_PLATFORM" --tools "$CI_TOOLS" --evidence "$RUNNER_TEMP/admitted/bootstrap-evidence.json"
    - id: route
      env:
        EVENT_NAME: ${{ github.event_name }}
      run: |
        python -B scripts/ci/route.py --event-name "$EVENT_NAME" --event "$GITHUB_EVENT_PATH" --root . --out "$RUNNER_TEMP/route.json"
        printf 'route=%s\n' "$(cat "$RUNNER_TEMP/route.json")" >> "$GITHUB_OUTPUT"
  ci-contracts:
    needs:
    - route
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ fromJSON(needs.route.outputs.route).testedSha }}
    - name: Bootstrap admitted toolchains
      shell: bash
      working-directory: .
      env:
        CI_PLATFORM: linux-x64
        CI_TOOLS: python,go
      run: python3 -B scripts/ci/bootstrap.py --lock scripts/ci/toolchains.lock.json --platform "$CI_PLATFORM" --tools "$CI_TOOLS" --dest "$RUNNER_TEMP/admitted" --cache-mode none --env-out "$RUNNER_TEMP/tools.env"
    - name: Apply admitted toolchain environment
      shell: bash
      working-directory: .
      run: cat "$RUNNER_TEMP/tools.env" >> "$GITHUB_ENV"
    - name: Verify admitted toolchain evidence
      shell: bash
      working-directory: .
      env:
        CI_PLATFORM: linux-x64
        CI_TOOLS: python,go
      run: python3 -B scripts/ci/bootstrap/controls.py evidence --lock scripts/ci/toolchains.lock.json --platform "$CI_PLATFORM" --tools "$CI_TOOLS" --evidence "$RUNNER_TEMP/admitted/bootstrap-evidence.json"
    - name: Create fresh Go caches
      shell: bash
      working-directory: .
      run: python -B scripts/ci/fresh_go.py --root "$RUNNER_TEMP/go-fresh" --env-out "$GITHUB_ENV"
    - name: Download and verify Go modules
      shell: bash
      working-directory: server
      run: |
        go mod download
        go mod verify
    - name: Format and vet the Go test declaration helper
      shell: bash
      working-directory: scripts/ci/gotestdecls
      run: |
        unformatted="$(gofmt -l .)"
        if [ -n "$unformatted" ]; then
          printf '%s\n' "$unformatted"
          exit 1
        fi
        go vet .
    - name: Create validator environment
      shell: bash --noprofile --norc -p -e -o pipefail {0}
      working-directory: .
      run: python -B scripts/ci/python_env.py --venv "$RUNNER_TEMP/validator" --path-out "$GITHUB_PATH"
    - name: Install hash-locked validator closure
      shell: bash --noprofile --norc -p -e -o pipefail {0}
      working-directory: .
      run: |
        python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes --only-binary=:all: -r .github/requirements-design.txt
        python -m pip check
        python -I -S -B scripts/ci/python_env.py --check
    - run: python -B -m unittest discover -s scripts/ci -p 'test_*.py' -v
    - run: python -B scripts/ci/check_policy.py --root .
    - name: Re-verify validator environment
      shell: bash --noprofile --norc -p -e -o pipefail {0}
      working-directory: .
      run: python -I -S -B scripts/ci/python_env.py --check
    - name: Write successful leaf receipt
      id: proof
      shell: bash
      working-directory: .
      env:
        ROUTE_JSON: ${{ needs.route.outputs.route }}
        UNIT: ci-contracts
        CHECKS: '["ci-go-helper", "ci-unit", "ci-policy"]'
        HOST_OS: ''
      run: |
        python - <<'PY'
        import json, os, pathlib, sys
        sys.path.insert(0, 'scripts/ci')
        import inventory, required
        route = json.loads(os.environ['ROUTE_JSON'])
        unit = os.environ['UNIT']
        if os.environ['HOST_OS']:
            unit += ':' + inventory.HOSTS[os.environ['HOST_OS']]
        item = required.receipt(route, unit, json.loads(os.environ['CHECKS']))
        out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ci-proof'
        out.mkdir()
        (out / 'receipt.json').write_text(json.dumps(item) + '\n')
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write('artifact=' + required.artifact_name(route, unit) + '\n')
        PY
    - name: Upload leaf receipt
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ${{ steps.proof.outputs.artifact }}
        path: ${{ runner.temp }}/ci-proof/receipt.json
        retention-days: 30
        if-no-files-found: error
  design:
    needs:
    - route
    if: ${{ contains(fromJSON(needs.route.outputs.route).groups, 'design') }}
    uses: ./.github/workflows/design.yml
    with:
      route: ${{ needs.route.outputs.route }}
  server:
    needs:
    - route
    if: ${{ contains(fromJSON(needs.route.outputs.route).groups, 'server') || contains(fromJSON(needs.route.outputs.route).groups,
      'loader') || contains(fromJSON(needs.route.outputs.route).groups, 'ocsf') }}
    uses: ./.github/workflows/server.yml
    with:
      route: ${{ needs.route.outputs.route }}
  agent:
    needs:
    - route
    if: ${{ contains(fromJSON(needs.route.outputs.route).groups, 'agent') || contains(fromJSON(needs.route.outputs.route).groups,
      'interop') }}
    uses: ./.github/workflows/agent.yml
    with:
      route: ${{ needs.route.outputs.route }}
  console:
    needs:
    - route
    if: ${{ contains(fromJSON(needs.route.outputs.route).groups, 'console') }}
    uses: ./.github/workflows/console.yml
    with:
      route: ${{ needs.route.outputs.route }}
  bootstrap:
    needs:
    - route
    if: ${{ contains(fromJSON(needs.route.outputs.route).groups, 'bootstrap') }}
    uses: ./.github/workflows/bootstrap.yml
    with:
      route: ${{ needs.route.outputs.route }}
  gitleaks:
    needs:
    - route
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
        ref: ${{ fromJSON(needs.route.outputs.route).testedSha }}
    - name: Bootstrap admitted toolchains
      shell: bash
      working-directory: .
      env:
        CI_PLATFORM: linux-x64
        CI_TOOLS: python
      run: python3 -B scripts/ci/bootstrap.py --lock scripts/ci/toolchains.lock.json --platform "$CI_PLATFORM" --tools "$CI_TOOLS" --dest "$RUNNER_TEMP/admitted" --cache-mode none --env-out "$RUNNER_TEMP/tools.env"
    - name: Apply admitted toolchain environment
      shell: bash
      working-directory: .
      run: cat "$RUNNER_TEMP/tools.env" >> "$GITHUB_ENV"
    - name: Verify admitted toolchain evidence
      shell: bash
      working-directory: .
      env:
        CI_PLATFORM: linux-x64
        CI_TOOLS: python
      run: python3 -B scripts/ci/bootstrap/controls.py evidence --lock scripts/ci/toolchains.lock.json --platform "$CI_PLATFORM" --tools "$CI_TOOLS" --evidence "$RUNNER_TEMP/admitted/bootstrap-evidence.json"
    - id: preflight
      shell: bash
      working-directory: .
      env:
        ROUTE_JSON: ${{ needs.route.outputs.route }}
      run: |
        python -B - <<'PY'
        import os, pathlib
        (pathlib.Path(os.environ['RUNNER_TEMP']) / 'route.json').write_text(os.environ['ROUTE_JSON'])
        PY
        python -B scripts/ci/security_scan.py gitleaks --phase preflight --root . --route "$RUNNER_TEMP/route.json" --output "$RUNNER_TEMP/security-gitleaks-preflight"
    - id: scan
      shell: bash
      working-directory: .
      run: python -B scripts/ci/security_scan.py gitleaks --phase scan --root . --route "$RUNNER_TEMP/route.json" --output "$RUNNER_TEMP/security-gitleaks"
    - id: diagnostics
      if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: security-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-gitleaks
        path: |-
          ${{ runner.temp }}/security-gitleaks-preflight/diagnostics.json
          ${{ runner.temp }}/security-gitleaks/diagnostics.json
        retention-days: 30
        if-no-files-found: error
    - id: proof
      shell: bash
      working-directory: .
      run: |
        python -B scripts/ci/security_scan.py gitleaks --phase verify --root . --route "$RUNNER_TEMP/route.json" --output "$RUNNER_TEMP/security-gitleaks"
        python -B scripts/ci/required.py --route "$RUNNER_TEMP/route.json" --emit-unit gitleaks --checks '["gitleaks-admission", "gitleaks-history", "gitleaks-tree", "gitleaks-gate"]' --out "$RUNNER_TEMP/ci-proof/receipt.json"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ${{ steps.proof.outputs.artifact }}
        path: ${{ runner.temp }}/ci-proof/receipt.json
        retention-days: 30
        if-no-files-found: error
  semgrep:
    needs:
    - route
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
        ref: ${{ fromJSON(needs.route.outputs.route).testedSha }}
    - name: Bootstrap admitted toolchains
      shell: bash
      working-directory: .
      env:
        CI_PLATFORM: linux-x64
        CI_TOOLS: python
      run: python3 -B scripts/ci/bootstrap.py --lock scripts/ci/toolchains.lock.json --platform "$CI_PLATFORM" --tools "$CI_TOOLS" --dest "$RUNNER_TEMP/admitted" --cache-mode none --env-out "$RUNNER_TEMP/tools.env"
    - name: Apply admitted toolchain environment
      shell: bash
      working-directory: .
      run: cat "$RUNNER_TEMP/tools.env" >> "$GITHUB_ENV"
    - name: Verify admitted toolchain evidence
      shell: bash
      working-directory: .
      env:
        CI_PLATFORM: linux-x64
        CI_TOOLS: python
      run: python3 -B scripts/ci/bootstrap/controls.py evidence --lock scripts/ci/toolchains.lock.json --platform "$CI_PLATFORM" --tools "$CI_TOOLS" --evidence "$RUNNER_TEMP/admitted/bootstrap-evidence.json"
    - id: preflight
      shell: bash
      working-directory: .
      env:
        ROUTE_JSON: ${{ needs.route.outputs.route }}
      run: |
        python -B - <<'PY'
        import os, pathlib
        (pathlib.Path(os.environ['RUNNER_TEMP']) / 'route.json').write_text(os.environ['ROUTE_JSON'])
        PY
        python -B scripts/ci/security_scan.py semgrep --phase preflight --root . --route "$RUNNER_TEMP/route.json" --output "$RUNNER_TEMP/security-semgrep-preflight"
    - id: admission
      shell: bash
      working-directory: .
      run: python -B scripts/ci/security_scan.py semgrep --phase admission --root . --route "$RUNNER_TEMP/route.json" --output "$RUNNER_TEMP/security-semgrep-admission"
    - id: scan
      shell: bash
      working-directory: .
      run: python -B scripts/ci/security_scan.py semgrep --phase scan --root . --route "$RUNNER_TEMP/route.json" --output "$RUNNER_TEMP/security-semgrep"
      env:
        SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
    - id: diagnostics
      if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: security-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-semgrep
        path: |-
          ${{ runner.temp }}/security-semgrep-preflight/diagnostics.json
          ${{ runner.temp }}/security-semgrep-admission/diagnostics.json
          ${{ runner.temp }}/security-semgrep/diagnostics.json
        retention-days: 30
        if-no-files-found: error
    - id: proof
      shell: bash
      working-directory: .
      run: |
        python -B scripts/ci/security_scan.py semgrep --phase verify --root . --route "$RUNNER_TEMP/route.json" --output "$RUNNER_TEMP/security-semgrep"
        python -B scripts/ci/required.py --route "$RUNNER_TEMP/route.json" --emit-unit semgrep --checks '["semgrep-admission", "semgrep-code", "semgrep-supply-chain", "semgrep-gate"]' --out "$RUNNER_TEMP/ci-proof/receipt.json"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ${{ steps.proof.outputs.artifact }}
        path: ${{ runner.temp }}/ci-proof/receipt.json
        retention-days: 30
        if-no-files-found: error
  ci-required:
    name: ci-required
    needs:
    - route
    - ci-contracts
    - design
    - server
    - agent
    - console
    - bootstrap
    - gitleaks
    - semgrep
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Bootstrap admitted toolchains
      shell: bash
      working-directory: .
      env:
        CI_PLATFORM: linux-x64
        CI_TOOLS: python
      run: python3 -B scripts/ci/bootstrap.py --lock scripts/ci/toolchains.lock.json --platform "$CI_PLATFORM" --tools "$CI_TOOLS" --dest "$RUNNER_TEMP/admitted" --cache-mode none --env-out "$RUNNER_TEMP/tools.env"
    - name: Apply admitted toolchain environment
      shell: bash
      working-directory: .
      run: cat "$RUNNER_TEMP/tools.env" >> "$GITHUB_ENV"
    - name: Verify admitted toolchain evidence
      shell: bash
      working-directory: .
      env:
        CI_PLATFORM: linux-x64
        CI_TOOLS: python
      run: python3 -B scripts/ci/bootstrap/controls.py evidence --lock scripts/ci/toolchains.lock.json --platform "$CI_PLATFORM" --tools "$CI_TOOLS" --evidence "$RUNNER_TEMP/admitted/bootstrap-evidence.json"
    - name: Create validator environment
      shell: bash --noprofile --norc -p -e -o pipefail {0}
      working-directory: .
      run: python -B scripts/ci/python_env.py --venv "$RUNNER_TEMP/validator" --path-out "$GITHUB_PATH"
    - name: Install hash-locked validator closure
      shell: bash --noprofile --norc -p -e -o pipefail {0}
      working-directory: .
      run: |
        python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes --only-binary=:all: -r .github/requirements-design.txt
        python -m pip check
        python -I -S -B scripts/ci/python_env.py --check
    - name: Download same-run receipts
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        pattern: ci-proof-${{ github.run_id }}-${{ github.run_attempt }}-*
        path: ${{ runner.temp }}/ci-receipts
        merge-multiple: false
    - name: Prepare aggregate inputs
      shell: bash
      env:
        ROUTE_JSON: ${{ needs.route.outputs.route }}
        NEEDS_JSON: ${{ toJSON(needs) }}
      run: |
        python - <<'PY'
        import os, pathlib
        root = pathlib.Path(os.environ['RUNNER_TEMP'])
        (root / 'route.json').write_text(os.environ['ROUTE_JSON'])
        (root / 'needs.json').write_text(os.environ['NEEDS_JSON'])
        PY
    - name: Re-verify validator environment
      shell: bash --noprofile --norc -p -e -o pipefail {0}
      working-directory: .
      run: python -I -S -B scripts/ci/python_env.py --check
    - name: Require exact successful work
      shell: bash
      run: python -B scripts/ci/required.py --route "$RUNNER_TEMP/route.json" --needs "$RUNNER_TEMP/needs.json" --receipts "$RUNNER_TEMP/ci-receipts"
