name: Agent checks
'on':
  workflow_call:
    inputs:
      route:
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate:
    if: ${{ contains(fromJSON(inputs.route).groups, 'agent') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agent
        shell: bash --noprofile --norc -p -e -o pipefail {0}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-15
          host: aarch64-apple-darwin
          arch: ARM64
        - os: windows-2025
          host: x86_64-pc-windows-msvc
          arch: X64
        - os: ubuntu-24.04
          host: x86_64-unknown-linux-gnu
          arch: X64
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ fromJSON(inputs.route).testedSha }}
    - name: Bootstrap admitted toolchains
      shell: bash --noprofile --norc -p -e -o pipefail {0}
      working-directory: .
      env:
        CI_PLATFORM: '${{ fromJSON(''{"ubuntu-24.04":"linux-x64","windows-2025":"windows-x64","macos-15":"macos-arm64"}'')[matrix.os] }}'
        CI_TOOLS: python,rust
      run: python3 -B scripts/ci/bootstrap.py --lock scripts/ci/toolchains.lock.json --platform "$CI_PLATFORM" --tools "$CI_TOOLS" --dest "$RUNNER_TEMP/admitted" --cache-mode none --env-out "$RUNNER_TEMP/tools.env"
    - name: Apply admitted toolchain environment
      shell: bash --noprofile --norc -p -e -o pipefail {0}
      working-directory: .
      run: cat "$RUNNER_TEMP/tools.env" >> "$GITHUB_ENV"
    - name: Verify admitted toolchain evidence
      shell: bash --noprofile --norc -p -e -o pipefail {0}
      working-directory: .
      env:
        CI_PLATFORM: '${{ fromJSON(''{"ubuntu-24.04":"linux-x64","windows-2025":"windows-x64","macos-15":"macos-arm64"}'')[matrix.os] }}'
        CI_TOOLS: python,rust
      run: python3 -B scripts/ci/bootstrap/controls.py evidence --lock scripts/ci/toolchains.lock.json --platform "$CI_PLATFORM" --tools "$CI_TOOLS" --evidence "$RUNNER_TEMP/admitted/bootstrap-evidence.json"
    - name: Assert native receipt host
      shell: bash --noprofile --norc -p -e -o pipefail {0}
      working-directory: .
      env:
        HOST_OS: ${{ matrix.os }}
      run: |
        python - <<'PY'
        import os, platform, sys
        sys.path.insert(0, 'scripts/ci')
        from inventory import HOSTS
        expected = HOSTS[os.environ['HOST_OS']]
        actual = {'Linux': 'linux', 'Windows': 'windows', 'Darwin': 'macos'}[platform.system()]
        arch = {'x86_64': 'x64', 'AMD64': 'x64', 'arm64': 'arm64', 'aarch64': 'arm64'}[platform.machine()]
        assert actual + '-' + arch == expected, (actual, arch, expected)
        PY
    - name: Check native host and toolchain
      env:
        ACTUAL_ARCH: ${{ runner.arch }}
        EXPECTED_ARCH: ${{ matrix.arch }}
        EXPECTED_HOST: ${{ matrix.host }}
      shell: bash --noprofile --norc -p -e -o pipefail {0}
      run: |
        test "$ACTUAL_ARCH" = "$EXPECTED_ARCH"
        release="$(rustc -vV | sed -n 's/^release: //p' | tr -d '\r')"
        host="$(rustc -vV | sed -n 's/^host: //p' | tr -d '\r')"
        test "$release" = '1.99.0'
        test "$host" = "$EXPECTED_HOST"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: |
          ${{ runner.temp }}/admitted/cargo-home/registry/index
          ${{ runner.temp }}/admitted/cargo-home/registry/cache
        key: agent-cargo-registry-${{ runner.os }}-${{ runner.arch }}-1.99.0-${{ hashFiles('agent/Cargo.lock') }}
    - name: Admit Cargo downloads and fresh target
      shell: bash --noprofile --norc -p -e -o pipefail {0}
      working-directory: .
      run: python -B scripts/ci/fresh_go.py --root "$RUNNER_TEMP/cargo-fresh" --env-out "$GITHUB_ENV" --cargo-home "$CARGO_HOME" --cargo-lock "$PWD/agent/Cargo.lock"
    - name: Check locked dependency pins
      shell: bash --noprofile --norc -p -e -o pipefail {0}
      run: |
        unset ZSTD_SYS_USE_PKG_CONFIG
        test -z "${ZSTD_SYS_USE_PKG_CONFIG+x}"
        cargo metadata --locked --format-version 1 | python -c '
        import json, sys
        data = json.load(sys.stdin)
        expected = {("cc", "1.4.5"), ("cfg-if", "1.0.4"), ("crc32c", "0.6.8"), ("find-msvc-tools", "0.1.12"), ("getrandom", "0.4.3"), ("jobserver", "0.1.35"), ("libc", "0.2.189"), ("pkg-config", "0.3.34"), ("r-efi", "6.0.0"), ("ricevanta-batch", "0.1.0"), ("ricevanta-config", "0.1.0"), ("ricevanta-json", "0.1.0"), ("ricevanta-os", "0.1.0"), ("ricevanta-os-linux", "0.1.0"), ("ricevanta-os-macos", "0.1.0"), ("ricevanta-os-windows", "0.1.0"), ("ricevanta-spool", "0.1.0"), ("rustc_version", "0.4.1"), ("semver", "1.0.27"), ("shlex", "2.0.1"), ("windows-link", "0.2.1"), ("windows-sys", "0.61.2"), ("zstd", "0.13.3"), ("zstd-safe", "7.2.2"), ("zstd-sys", "2.0.16+zstd.1.5.7")}
        actual = {(p["name"], p["version"]) for p in data["packages"]}
        assert actual == expected and len(data["packages"]) == 25, "unexpected dependency closure"
        print("Locked dependency pins verified")
        '
    - name: Check fixture drift
      shell: bash --noprofile --norc -p -e -o pipefail {0}
      run: python tools/generate-spool-fixtures.py --check
    - name: Check formatting
      shell: bash --noprofile --norc -p -e -o pipefail {0}
      run: |
        unset ZSTD_SYS_USE_PKG_CONFIG
        test -z "${ZSTD_SYS_USE_PKG_CONFIG+x}"
        cargo fmt --all -- --check
    - name: Record Unix C compiler
      if: runner.os != 'Windows'
      shell: bash --noprofile --norc -p -e -o pipefail {0}
      run: ${CC:-cc} --version
    - name: Record MSVC compiler
      if: runner.os == 'Windows'
      shell: pwsh -NoLogo -NoProfile -NonInteractive -Command ". '{0}'"
      working-directory: agent
      run: ./tools/check-msvc.ps1
    - name: Clippy
      env:
        CARGO_NET_OFFLINE: 'true'
        CC_ENABLE_DEBUG_OUTPUT: '1'
      shell: bash --noprofile --norc -p -e -o pipefail {0}
      run: |
        unset ZSTD_SYS_USE_PKG_CONFIG
        test -z "${ZSTD_SYS_USE_PKG_CONFIG+x}"
        cargo clippy --locked --workspace --all-targets -vv -- -D warnings
    - name: Test
      shell: bash --noprofile --norc -p -e -o pipefail {0}
      working-directory: .
      env:
        CARGO_NET_OFFLINE: 'true'
        CC_ENABLE_DEBUG_OUTPUT: '1'
      run: |
        unset ZSTD_SYS_USE_PKG_CONFIG
        test -z "${ZSTD_SYS_USE_PKG_CONFIG+x}"
        python -B scripts/ci/run_selected.py --id agent-unit --evidence "$RUNNER_TEMP/evidence"
    - name: Extended recovery property test
      shell: bash --noprofile --norc -p -e -o pipefail {0}
      working-directory: .
      env:
        CARGO_NET_OFFLINE: 'true'
      run: |
        unset ZSTD_SYS_USE_PKG_CONFIG
        test -z "${ZSTD_SYS_USE_PKG_CONFIG+x}"
        python -B scripts/ci/run_selected.py --id spool-extended --evidence "$RUNNER_TEMP/evidence"
    - name: Extended seal property test
      shell: bash --noprofile --norc -p -e -o pipefail {0}
      working-directory: .
      env:
        CARGO_NET_OFFLINE: 'true'
      run: |
        unset ZSTD_SYS_USE_PKG_CONFIG
        test -z "${ZSTD_SYS_USE_PKG_CONFIG+x}"
        python -B scripts/ci/run_selected.py --id batch-extended --evidence "$RUNNER_TEMP/evidence"
    - name: Extended JSON property test
      shell: bash --noprofile --norc -p -e -o pipefail {0}
      working-directory: .
      env:
        CARGO_NET_OFFLINE: 'true'
      run: python -B scripts/ci/run_selected.py --id json-extended --evidence "$RUNNER_TEMP/evidence"
    - name: Root Linux protection tests
      if: runner.os == 'Linux'
      shell: bash --noprofile --norc -p -e -o pipefail {0}
      working-directory: .
      env:
        CARGO_NET_OFFLINE: 'true'
      run: python -B scripts/ci/run_selected.py --id agent-protection-root-linux --evidence "$RUNNER_TEMP/evidence"
    - name: Root macOS protection tests
      if: runner.os == 'macOS'
      shell: bash --noprofile --norc -p -e -o pipefail {0}
      working-directory: .
      env:
        CARGO_NET_OFFLINE: 'true'
      run: python -B scripts/ci/run_selected.py --id agent-protection-root-macos --evidence "$RUNNER_TEMP/evidence"
    - name: Write successful leaf receipt
      id: proof
      shell: bash --noprofile --norc -p -e -o pipefail {0}
      working-directory: .
      env:
        ROUTE_JSON: ${{ inputs.route }}
        UNIT: agent
        CHECKS: '["agent-host", "agent-pins", "agent-fixtures", "agent-format", "agent-clippy", "agent-unit", "spool-extended",
          "batch-extended", "json-extended"]'
        HOST_OS: ${{ matrix.os }}
      run: |
        python - <<'PY'
        import json, os, pathlib, sys
        sys.path.insert(0, 'scripts/ci')
        import inventory, required
        route = json.loads(os.environ['ROUTE_JSON'])
        unit = os.environ['UNIT']
        if os.environ['HOST_OS']:
            unit += ':' + inventory.HOSTS[os.environ['HOST_OS']]
        checks = json.loads(os.environ['CHECKS']) + inventory.agent_native_checks(inventory.HOSTS[os.environ['HOST_OS']])
        item = required.receipt(route, unit, checks, pathlib.Path(os.environ['RUNNER_TEMP']) / 'evidence')
        out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ci-proof'
        out.mkdir()
        (out / 'receipt.json').write_text(json.dumps(item) + '\n')
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write('artifact=' + required.artifact_name(route, unit) + '\n')
        PY
    - name: Upload leaf receipt
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ${{ steps.proof.outputs.artifact }}
        path: ${{ runner.temp }}/ci-proof/receipt.json
        retention-days: 30
        if-no-files-found: error
  rustinterop:
    if: ${{ contains(fromJSON(inputs.route).groups, 'interop') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash --noprofile --norc -p -e -o pipefail {0}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ fromJSON(inputs.route).testedSha }}
    - name: Bootstrap admitted toolchains
      shell: bash --noprofile --norc -p -e -o pipefail {0}
      working-directory: .
      env:
        CI_PLATFORM: linux-x64
        CI_TOOLS: python,go,rust
      run: python3 -B scripts/ci/bootstrap.py --lock scripts/ci/toolchains.lock.json --platform "$CI_PLATFORM" --tools "$CI_TOOLS" --dest "$RUNNER_TEMP/admitted" --cache-mode none --env-out "$RUNNER_TEMP/tools.env"
    - name: Apply admitted toolchain environment
      shell: bash --noprofile --norc -p -e -o pipefail {0}
      working-directory: .
      run: cat "$RUNNER_TEMP/tools.env" >> "$GITHUB_ENV"
    - name: Verify admitted toolchain evidence
      shell: bash --noprofile --norc -p -e -o pipefail {0}
      working-directory: .
      env:
        CI_PLATFORM: linux-x64
        CI_TOOLS: python,go,rust
      run: python3 -B scripts/ci/bootstrap/controls.py evidence --lock scripts/ci/toolchains.lock.json --platform "$CI_PLATFORM" --tools "$CI_TOOLS" --evidence "$RUNNER_TEMP/admitted/bootstrap-evidence.json"
    - name: Create fresh Go caches
      shell: bash --noprofile --norc -p -e -o pipefail {0}
      working-directory: .
      run: python -B scripts/ci/fresh_go.py --root "$RUNNER_TEMP/go-fresh" --env-out "$GITHUB_ENV"
    - name: Download and verify Go modules
      shell: bash --noprofile --norc -p -e -o pipefail {0}
      working-directory: server
      run: |
        go mod download
        go mod verify
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: |
          ${{ runner.temp }}/admitted/cargo-home/registry/index
          ${{ runner.temp }}/admitted/cargo-home/registry/cache
        key: agent-cargo-${{ runner.os }}-${{ runner.arch }}-1.99.0-${{ hashFiles('agent/Cargo.lock') }}
    - name: Check admitted Rust and native host
      shell: bash --noprofile --norc -p -e -o pipefail {0}
      run: |
        test "$(rustc -vV | sed -n 's/^release: //p')" = '1.99.0'
        host="$(rustc -vV | sed -n 's/^host: //p')"
        test "$host" = 'x86_64-unknown-linux-gnu'
        test "$RUNNER_ARCH" = 'X64'
        cc --version
    - name: Admit Cargo downloads and fresh target
      shell: bash --noprofile --norc -p -e -o pipefail {0}
      working-directory: .
      run: python -B scripts/ci/fresh_go.py --root "$RUNNER_TEMP/cargo-fresh" --env-out "$GITHUB_ENV" --cargo-home "$CARGO_HOME" --cargo-lock "$PWD/agent/Cargo.lock"
    - name: Build live writer
      working-directory: agent
      env:
        CC_ENABLE_DEBUG_OUTPUT: '1'
      shell: bash --noprofile --norc -p -e -o pipefail {0}
      run: |
        unset ZSTD_SYS_USE_PKG_CONFIG
        test -z "${ZSTD_SYS_USE_PKG_CONFIG+x}"
        cargo build --locked -p ricevanta-batch --example seal-vector -vv
        vector="$CARGO_TARGET_DIR/debug/examples/seal-vector"
        test "${vector:0:1}" = '/'
        test -x "$vector"
        echo "RICEVANTA_BATCH_VECTOR=$vector" >> "$GITHUB_ENV"
    - name: Live Go decoder conformance
      shell: bash --noprofile --norc -p -e -o pipefail {0}
      working-directory: .
      run: python -B scripts/ci/run_selected.py --id interop-unit --evidence "$RUNNER_TEMP/evidence"
    - name: Live Go decoder conformance with race detector
      shell: bash --noprofile --norc -p -e -o pipefail {0}
      working-directory: .
      run: python -B scripts/ci/run_selected.py --id interop-race --evidence "$RUNNER_TEMP/evidence"
    - name: Write successful leaf receipt
      id: proof
      shell: bash --noprofile --norc -p -e -o pipefail {0}
      working-directory: .
      env:
        ROUTE_JSON: ${{ inputs.route }}
        UNIT: interop
        CHECKS: '["interop-build", "interop-unit", "interop-race"]'
        HOST_OS: ''
      run: |
        python - <<'PY'
        import json, os, pathlib, sys
        sys.path.insert(0, 'scripts/ci')
        import inventory, required
        route = json.loads(os.environ['ROUTE_JSON'])
        unit = os.environ['UNIT']
        if os.environ['HOST_OS']:
            unit += ':' + inventory.HOSTS[os.environ['HOST_OS']]
        item = required.receipt(route, unit, json.loads(os.environ['CHECKS']), pathlib.Path(os.environ['RUNNER_TEMP']) / 'evidence')
        out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ci-proof'
        out.mkdir()
        (out / 'receipt.json').write_text(json.dumps(item) + '\n')
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write('artifact=' + required.artifact_name(route, unit) + '\n')
        PY
    - name: Upload leaf receipt
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ${{ steps.proof.outputs.artifact }}
        path: ${{ runner.temp }}/ci-proof/receipt.json
        retention-days: 30
        if-no-files-found: error
