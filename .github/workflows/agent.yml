name: Agent checks

on:
  push:
    branches: [master]
    paths:
      - 'agent/**'
      - 'schemas/agent/**'
      - '.github/workflows/agent.yml'
  pull_request:
    paths:
      - 'agent/**'
      - 'schemas/agent/**'
      - '.github/workflows/agent.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agent
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            host: aarch64-apple-darwin
            arch: ARM64
          - os: windows-2025
            host: x86_64-pc-windows-msvc
            arch: X64
          - os: ubuntu-24.04
            host: x86_64-unknown-linux-gnu
            arch: X64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.7'
      - name: Install Rust
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Check native host and toolchain
        env:
          ACTUAL_ARCH: ${{ runner.arch }}
          EXPECTED_ARCH: ${{ matrix.arch }}
          EXPECTED_HOST: ${{ matrix.host }}
        run: |
          test "$ACTUAL_ARCH" = "$EXPECTED_ARCH"
          release="$(rustc -vV | sed -n 's/^release: //p' | tr -d '\r')"
          host="$(rustc -vV | sed -n 's/^host: //p' | tr -d '\r')"
          test "$release" = '1.99.0'
          test "$host" = "$EXPECTED_HOST"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
          key: agent-cargo-${{ runner.os }}-${{ runner.arch }}-1.99.0-${{ hashFiles('agent/Cargo.lock') }}
      - name: Check locked dependency pins
        run: |
          cargo metadata --locked --format-version 1 | python -c '
          import json, sys
          data = json.load(sys.stdin)
          expected = {("ricevanta-spool", "0.1.0"), ("crc32c", "0.6.8"), ("rustc_version", "0.4.1"), ("semver", "1.0.27")}
          actual = {(p["name"], p["version"]) for p in data["packages"]}
          assert actual == expected and len(data["packages"]) == len(expected), "unexpected dependency closure"
          print("Locked dependency pins verified")
          '
      - name: Check fixture drift
        run: python tools/generate-spool-fixtures.py --check
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        env:
          CARGO_NET_OFFLINE: 'true'
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        env:
          CARGO_NET_OFFLINE: 'true'
        run: cargo test --locked --workspace
