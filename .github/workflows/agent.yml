name: Agent checks
'on':
  workflow_call:
    inputs:
      route:
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate:
    if: ${{ contains(fromJSON(inputs.route).groups, 'agent') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agent
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-15
          host: aarch64-apple-darwin
          arch: ARM64
        - os: windows-2025
          host: x86_64-pc-windows-msvc
          arch: X64
        - os: ubuntu-24.04
          host: x86_64-unknown-linux-gnu
          arch: X64
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ fromJSON(inputs.route).testedSha }}
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: 3.13.7
    - name: Assert native receipt host
      shell: bash
      working-directory: .
      env:
        HOST_OS: ${{ matrix.os }}
      run: |
        python - <<'PY'
        import os, platform, sys
        sys.path.insert(0, 'scripts/ci')
        from inventory import HOSTS
        expected = HOSTS[os.environ['HOST_OS']]
        actual = {'Linux': 'linux', 'Windows': 'windows', 'Darwin': 'macos'}[platform.system()]
        arch = {'x86_64': 'x64', 'AMD64': 'x64', 'arm64': 'arm64', 'aarch64': 'arm64'}[platform.machine()]
        assert actual + '-' + arch == expected, (actual, arch, expected)
        PY
    - name: Install Rust
      run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
    - name: Check native host and toolchain
      env:
        ACTUAL_ARCH: ${{ runner.arch }}
        EXPECTED_ARCH: ${{ matrix.arch }}
        EXPECTED_HOST: ${{ matrix.host }}
      run: |
        test "$ACTUAL_ARCH" = "$EXPECTED_ARCH"
        release="$(rustc -vV | sed -n 's/^release: //p' | tr -d '\r')"
        host="$(rustc -vV | sed -n 's/^host: //p' | tr -d '\r')"
        test "$release" = '1.99.0'
        test "$host" = "$EXPECTED_HOST"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
        key: agent-cargo-registry-${{ runner.os }}-${{ runner.arch }}-1.99.0-${{ hashFiles('agent/Cargo.lock') }}
    - name: Admit Cargo downloads and fresh target
      shell: bash
      working-directory: .
      run: python -B scripts/ci/fresh_go.py --root "$RUNNER_TEMP/cargo-fresh" --env-out "$GITHUB_ENV" --cargo-home "$HOME/.cargo" --cargo-lock "$PWD/agent/Cargo.lock"
    - name: Check locked dependency pins
      run: |
        unset ZSTD_SYS_USE_PKG_CONFIG
        test -z "${ZSTD_SYS_USE_PKG_CONFIG+x}"
        cargo metadata --locked --format-version 1 | python -c '
        import json, sys
        data = json.load(sys.stdin)
        expected = {("cc", "1.4.5"), ("cfg-if", "1.0.4"), ("crc32c", "0.6.8"), ("find-msvc-tools", "0.1.12"), ("getrandom", "0.4.3"), ("jobserver", "0.1.35"), ("libc", "0.2.189"), ("pkg-config", "0.3.34"), ("r-efi", "6.0.0"), ("ricevanta-batch", "0.1.0"), ("ricevanta-config", "0.1.0"), ("ricevanta-json", "0.1.0"), ("ricevanta-os", "0.1.0"), ("ricevanta-os-linux", "0.1.0"), ("ricevanta-spool", "0.1.0"), ("rustc_version", "0.4.1"), ("semver", "1.0.27"), ("shlex", "2.0.1"), ("zstd", "0.13.3"), ("zstd-safe", "7.2.2"), ("zstd-sys", "2.0.16+zstd.1.5.7")}
        actual = {(p["name"], p["version"]) for p in data["packages"]}
        assert actual == expected and len(data["packages"]) == 21, "unexpected dependency closure"
        print("Locked dependency pins verified")
        '
    - name: Check fixture drift
      run: python tools/generate-spool-fixtures.py --check
    - name: Check formatting
      run: |
        unset ZSTD_SYS_USE_PKG_CONFIG
        test -z "${ZSTD_SYS_USE_PKG_CONFIG+x}"
        cargo fmt --all -- --check
    - name: Record Unix C compiler
      if: runner.os != 'Windows'
      run: ${CC:-cc} --version
    - name: Record MSVC compiler
      if: runner.os == 'Windows'
      shell: pwsh
      run: ./tools/check-msvc.ps1
    - name: Clippy
      env:
        CARGO_NET_OFFLINE: 'true'
        CC_ENABLE_DEBUG_OUTPUT: '1'
      run: |
        unset ZSTD_SYS_USE_PKG_CONFIG
        test -z "${ZSTD_SYS_USE_PKG_CONFIG+x}"
        cargo clippy --locked --workspace --all-targets -vv -- -D warnings
    - name: Test
      env:
        CARGO_NET_OFFLINE: 'true'
        CC_ENABLE_DEBUG_OUTPUT: '1'
      run: |
        unset ZSTD_SYS_USE_PKG_CONFIG
        test -z "${ZSTD_SYS_USE_PKG_CONFIG+x}"
        cargo test --locked --workspace
    - name: Extended recovery property test
      env:
        CARGO_NET_OFFLINE: 'true'
      run: |
        unset ZSTD_SYS_USE_PKG_CONFIG
        test -z "${ZSTD_SYS_USE_PKG_CONFIG+x}"
        cargo test --locked -p ricevanta-spool --test fuzz_recover fuzz_recover_extended -- --ignored --exact
    - name: Extended seal property test
      env:
        CARGO_NET_OFFLINE: 'true'
      run: |
        unset ZSTD_SYS_USE_PKG_CONFIG
        test -z "${ZSTD_SYS_USE_PKG_CONFIG+x}"
        cargo test --locked -p ricevanta-batch --test fuzz_seal fuzz_seal_extended -- --ignored --exact
    - name: Write successful leaf receipt
      id: proof
      shell: bash
      working-directory: .
      env:
        ROUTE_JSON: ${{ inputs.route }}
        UNIT: agent
        CHECKS: '["agent-host", "agent-pins", "agent-fixtures", "agent-format", "agent-clippy", "agent-unit", "spool-extended",
          "batch-extended"]'
        HOST_OS: ${{ matrix.os }}
      run: |
        python - <<'PY'
        import json, os, pathlib, sys
        sys.path.insert(0, 'scripts/ci')
        import inventory, required
        route = json.loads(os.environ['ROUTE_JSON'])
        unit = os.environ['UNIT']
        if os.environ['HOST_OS']:
            unit += ':' + inventory.HOSTS[os.environ['HOST_OS']]
        item = required.receipt(route, unit, json.loads(os.environ['CHECKS']))
        out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ci-proof'
        out.mkdir()
        (out / 'receipt.json').write_text(json.dumps(item) + '\n')
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write('artifact=' + required.artifact_name(route, unit) + '\n')
        PY
    - name: Upload leaf receipt
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ${{ steps.proof.outputs.artifact }}
        path: ${{ runner.temp }}/ci-proof/receipt.json
        retention-days: 30
        if-no-files-found: error
  rustinterop:
    if: ${{ contains(fromJSON(inputs.route).groups, 'interop') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ fromJSON(inputs.route).testedSha }}
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: 3.14.8
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: server/go.mod
        cache: false
    - name: Create fresh Go caches
      shell: bash
      working-directory: .
      run: python -B scripts/ci/fresh_go.py --root "$RUNNER_TEMP/go-fresh" --env-out "$GITHUB_ENV"
    - name: Download and verify Go modules
      shell: bash
      working-directory: server
      run: |
        go mod download
        go mod verify
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
        key: agent-cargo-${{ runner.os }}-${{ runner.arch }}-1.99.0-${{ hashFiles('agent/Cargo.lock') }}
    - name: Install Rust and check native host
      run: |
        rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
        test "$(rustc +1.99.0 -vV | sed -n 's/^release: //p')" = '1.99.0'
        host="$(rustc +1.99.0 -vV | sed -n 's/^host: //p')"
        test "$host" = 'x86_64-unknown-linux-gnu'
        test "$RUNNER_ARCH" = 'X64'
        cc --version
    - name: Admit Cargo downloads and fresh target
      shell: bash
      working-directory: .
      run: python -B scripts/ci/fresh_go.py --root "$RUNNER_TEMP/cargo-fresh" --env-out "$GITHUB_ENV" --cargo-home "$HOME/.cargo" --cargo-lock "$PWD/agent/Cargo.lock"
    - name: Build live writer
      working-directory: agent
      env:
        CC_ENABLE_DEBUG_OUTPUT: '1'
      run: |
        unset ZSTD_SYS_USE_PKG_CONFIG
        test -z "${ZSTD_SYS_USE_PKG_CONFIG+x}"
        cargo build --locked -p ricevanta-batch --example seal-vector -vv
        vector="$CARGO_TARGET_DIR/debug/examples/seal-vector"
        test "${vector:0:1}" = '/'
        test -x "$vector"
        echo "RICEVANTA_BATCH_VECTOR=$vector" >> "$GITHUB_ENV"
    - name: Live Go decoder conformance
      working-directory: server
      run: go test -v -tags rustinterop ./internal/events/body -run '^TestRustWriter' -count=1
    - name: Live Go decoder conformance with race detector
      working-directory: server
      run: go test -v -race -tags rustinterop ./internal/events/body -run '^TestRustWriter' -count=1
    - name: Write successful leaf receipt
      id: proof
      shell: bash
      working-directory: .
      env:
        ROUTE_JSON: ${{ inputs.route }}
        UNIT: interop
        CHECKS: '["interop-build", "interop-unit", "interop-race"]'
        HOST_OS: ''
      run: |
        python - <<'PY'
        import json, os, pathlib, sys
        sys.path.insert(0, 'scripts/ci')
        import inventory, required
        route = json.loads(os.environ['ROUTE_JSON'])
        unit = os.environ['UNIT']
        if os.environ['HOST_OS']:
            unit += ':' + inventory.HOSTS[os.environ['HOST_OS']]
        item = required.receipt(route, unit, json.loads(os.environ['CHECKS']))
        out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ci-proof'
        out.mkdir()
        (out / 'receipt.json').write_text(json.dumps(item) + '\n')
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write('artifact=' + required.artifact_name(route, unit) + '\n')
        PY
    - name: Upload leaf receipt
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ${{ steps.proof.outputs.artifact }}
        path: ${{ runner.temp }}/ci-proof/receipt.json
        retention-days: 30
        if-no-files-found: error
