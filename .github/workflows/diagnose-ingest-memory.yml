name: Isolated ingest memory experiment (non-authoritative)
'on':
  push:
    branches:
    - wip/ingest-memory-diagnose
permissions:
  contents: read
jobs:
  ingest-memory-four-arm-experiment:
    name: Diagnose ingest memory with twelve fixed children
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash --noprofile --norc -p -e -o pipefail {0}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - name: Bootstrap admitted toolchains
      env:
        CI_PLATFORM: linux-x64
        CI_TOOLS: python,go
      run: python3 -B scripts/ci/bootstrap.py --lock scripts/ci/toolchains.lock.json --platform "$CI_PLATFORM" --tools "$CI_TOOLS" --dest "$RUNNER_TEMP/admitted" --cache-mode none --env-out "$RUNNER_TEMP/tools.env"
    - name: Apply admitted toolchain environment
      run: cat "$RUNNER_TEMP/tools.env" >> "$GITHUB_ENV"
    - name: Verify admitted toolchain evidence
      env:
        CI_PLATFORM: linux-x64
        CI_TOOLS: python,go
      run: python3 -B scripts/ci/bootstrap/controls.py evidence --lock scripts/ci/toolchains.lock.json --platform "$CI_PLATFORM" --tools "$CI_TOOLS" --evidence "$RUNNER_TEMP/admitted/bootstrap-evidence.json"
    - name: Create unused Go build and module caches
      run: python -B scripts/ci/fresh_go.py --root "$RUNNER_TEMP/go-fresh-memory-experiment" --env-out "$GITHUB_ENV"
    - name: Download and verify module sources
      working-directory: server
      run: |
        go mod download
        go mod verify
    - name: Prepare source and host evidence
      env:
        DIAGNOSTIC_DIR: ${{ runner.temp }}/ingest-memory-experiment
      run: |
        test ! -e "$DIAGNOSTIC_DIR"
        mkdir -m 700 "$DIAGNOSTIC_DIR"
        test "$(go version)" = 'go version go1.27.1 linux/amd64'
        {
          go version
          uname -srm
          getconf PAGESIZE
          getconf CLK_TCK
          getconf _NPROCESSORS_ONLN
          lscpu
          sha256sum "$(command -v go)" scripts/ci/toolchains.lock.json
          printf 'tested_sha=%s run=%s attempt=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          sha256sum server/internal/events/body/costmodel_norace_test.go server/internal/events/body/cost_memory_diagnose_norace_test.go .github/workflows/diagnose-ingest-memory.yml
        } > "$DIAGNOSTIC_DIR/host.log"
        cp .github/workflows/diagnose-ingest-memory.yml "$DIAGNOSTIC_DIR/workflow.yml"
        python -B - "$DIAGNOSTIC_DIR" <<'PY'
        import difflib
        import hashlib
        from pathlib import Path
        import sys
        target = Path('server/internal/events/body/cost_memory_diagnose_norace_test.go')
        patch = ''.join(difflib.unified_diff([], target.read_text().splitlines(keepends=True), fromfile='/dev/null', tofile='b/' + target.as_posix()))
        output = Path(sys.argv[1]) / 'diagnostic.patch'
        output.write_text(patch)
        print('diagnostic_patch_sha256=' + hashlib.sha256(output.read_bytes()).hexdigest())
        PY
        cp "$RUNNER_TEMP/admitted/bootstrap-evidence.json" "$DIAGNOSTIC_DIR/bootstrap-evidence.json"
    - name: Validate light experiment helpers and compile driver
      working-directory: server
      env:
        GOGC: '100'
        GOMEMLIMIT: 'off'
      run: |
        go test -count=1 ./internal/events/body -run '^TestMemoryDiag' -v 2>&1 | tee "$RUNNER_TEMP/ingest-memory-experiment/helper-tests.log"
        go test -c -o "$RUNNER_TEMP/ingest-memory-experiment/driver.test" ./internal/events/body
        sha256sum "$RUNNER_TEMP/ingest-memory-experiment/driver.test" > "$RUNNER_TEMP/ingest-memory-experiment/driver.sha256"
    - name: Run the fixed twelve-child experiment without retries
      working-directory: server
      env:
        RICEVANTA_MEMORY_DIAG_RUN: full
        RICEVANTA_MEMORY_DIAG_DIR: ${{ runner.temp }}/ingest-memory-experiment
        GOGC: '100'
        GOMEMLIMIT: 'off'
      run: '"$RUNNER_TEMP/ingest-memory-experiment/driver.test" -test.run=^TestCostMemoryExperiment$ -test.v -test.count=1 -test.timeout=15m 2>&1 | tee "$RUNNER_TEMP/ingest-memory-experiment/driver.log"'
    - name: Verify the complete population was retained
      if: always()
      run: |
        test -s "$RUNNER_TEMP/ingest-memory-experiment/driver.log"
        test -s "$RUNNER_TEMP/ingest-memory-experiment/population.json"
    - name: Retain every diagnostic command, identity, status and output
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ingest-memory-experiment-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/ingest-memory-experiment/
        retention-days: 30
        if-no-files-found: error
