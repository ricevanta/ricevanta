name: Diagnose Windows footprint assertion failures
'on':
  push:
    branches:
    - wip/footprint-windows-diagnose
permissions:
  contents: read
jobs:
  diagnose-footprint-windows:
    name: diagnose-footprint-windows-observe-once
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: 37988bb6ad7d10bcfca81f856f518f8d329efa97
    - name: Bootstrap admitted toolchains
      shell: bash --noprofile --norc -p -e -o pipefail {0}
      working-directory: .
      env:
        CI_PLATFORM: windows-x64
        CI_TOOLS: python
      run: python3 -B scripts/ci/bootstrap.py --lock scripts/ci/toolchains.lock.json --platform "$CI_PLATFORM" --tools "$CI_TOOLS" --dest "$RUNNER_TEMP/admitted"
        --cache-mode none --env-out "$RUNNER_TEMP/tools.env"
    - name: Apply admitted toolchain environment
      shell: bash --noprofile --norc -p -e -o pipefail {0}
      working-directory: .
      run: cat "$RUNNER_TEMP/tools.env" >> "$GITHUB_ENV"
    - name: Verify admitted toolchain evidence
      shell: bash --noprofile --norc -p -e -o pipefail {0}
      working-directory: .
      env:
        CI_PLATFORM: windows-x64
        CI_TOOLS: python
      run: python3 -B scripts/ci/bootstrap/controls.py evidence --lock scripts/ci/toolchains.lock.json --platform "$CI_PLATFORM" --tools "$CI_TOOLS" --evidence
        "$RUNNER_TEMP/admitted/bootstrap-evidence.json"
    - name: Create validator environment
      shell: bash --noprofile --norc -p -e -o pipefail {0}
      working-directory: .
      run: python -B scripts/ci/python_env.py --venv "$RUNNER_TEMP/validator" --path-out "$GITHUB_PATH"
    - name: Install hash-locked validator closure
      shell: bash --noprofile --norc -p -e -o pipefail {0}
      working-directory: .
      run: |
        python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes --only-binary=:all: -r .github/requirements-design.txt
        python -m pip check
        python -I -S -B scripts/ci/python_env.py --check
    - name: Assert native receipt host
      shell: bash --noprofile --norc -p -e -o pipefail {0}
      working-directory: .
      env:
        HOST_OS: windows-2025
      run: |
        python - <<'PY'
        import os, platform, sys
        sys.path.insert(0, 'scripts/ci')
        from inventory import HOSTS
        expected = HOSTS[os.environ['HOST_OS']]
        actual = {'Linux': 'linux', 'Windows': 'windows', 'Darwin': 'macos'}[platform.system()]
        arch = {'x86_64': 'x64', 'AMD64': 'x64', 'arm64': 'arm64', 'aarch64': 'arm64'}[platform.machine()]
        assert actual + '-' + arch == expected, (actual, arch, expected)
        PY
    - name: Materialize isolated observation driver
      shell: bash --noprofile --norc -p -e -o pipefail {0}
      working-directory: .
      run: |
        cat > "$RUNNER_TEMP/footprint-windows-observer.py" <<'PY'
        """Temporary, non-authoritative footprint diagnosis; never emits a leaf receipt."""
        import argparse
        import hashlib
        import json
        import os
        from pathlib import Path
        import sys
        import traceback

        SOURCE_CHECKOUT_SHA = '37988bb6ad7d10bcfca81f856f518f8d329efa97'


        def save(path, value):
            path.write_text(json.dumps(value, indent=2, sort_keys=True) + '\n', encoding='utf-8')


        def identity():
            return {key: os.environ.get(key) for key in ('GITHUB_SHA', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT')}


        def load_runner(root):
            # Match a direct scripts/ci/run_selected.py invocation's import directory.
            sys.path[0] = str(root / 'scripts/ci')
            import run_selected
            if Path(run_selected.__file__).resolve() != root / 'scripts/ci/run_selected.py':
                raise RuntimeError('diagnosis imported a foreign selected runner')
            return run_selected


        def call_main(runner, argv):
            sys.argv = argv
            runner.main()


        def child(root, diagnostics, argv):
            import unittest
            expected = root / 'scripts/ci/run_selected.py'
            if (len(argv) != 7 or Path(argv[0]).resolve() != expected
                    or argv[1:3] != ['--python-child', 'run']
                    or argv[3] != '--python-spec' or argv[5] != '--python-events'):
                raise RuntimeError('observer accepts only the unchanged execution child arguments')
            runner = load_runner(root)
            callbacks, observer_errors, originals = [], [], {}
            with (diagnostics / 'tracebacks.txt').open('x', encoding='utf-8', newline='\n') as output:
                output.write('Observation only. No required receipt or qualification claim.\n')
                output.flush()

                def record(kind, test, err, subtest=None):
                    # Observation failures cannot change the original result callback.
                    try:
                        item = {'callback': kind, 'id': test.id()}
                        if subtest is not None: item['subtest'] = str(subtest)
                        callbacks.append(item)
                        output.write('\n' + json.dumps(item, sort_keys=True) + '\n')
                        if err is not None:
                            traceback.print_exception(*err, file=output)
                        output.flush()
                    except Exception as error:
                        observer_errors.append(type(error).__name__)

                def observer(name, original):
                    def observe(result, test, *args):
                        returned = original(result, test, *args)
                        if name == 'addSubTest':
                            subtest, err = args
                            if err is not None: record(name, test, err, subtest)
                        else:
                            record(name, test, args[0] if args else None)
                        return returned
                    return observe

                for name in ('addFailure', 'addError', 'addSubTest', 'addExpectedFailure', 'addUnexpectedSuccess'):
                    originals[name] = getattr(unittest.TestResult, name)
                    setattr(unittest.TestResult, name, observer(name, originals[name]))
                status = 1
                try:
                    call_main(runner, argv)
                    status = 0
                except SystemExit as error:
                    status = error.code if isinstance(error.code, int) else int(error.code is not None)
                    raise
                finally:
                    for name, original in originals.items(): setattr(unittest.TestResult, name, original)
                    try:
                        save(diagnostics / 'child-observation.json', {
                            'qualification': 'diagnosis-only', 'wrapper_exit': status,
                            'source_checkout_sha': SOURCE_CHECKOUT_SHA,
                            'callbacks': callbacks, 'observer_errors': observer_errors,
                            'argv': argv, 'cwd': str(Path.cwd()), 'python': sys.version,
                            'python_executable': sys.executable, 'identity': identity(),
                        })
                    except Exception:
                        print('diagnosis observer could not retain its summary', file=sys.stderr)


        def parent(root, diagnostics, argv):
            expected = root / 'scripts/ci/run_selected.py'
            if (len(argv) != 5 or Path(argv[0]).resolve() != expected
                    or argv[1:4] != ['--id', 'footprint-unit-windows-x64', '--evidence']):
                raise RuntimeError('diagnosis runs exactly the complete Windows selected ID once')
            if sys.platform != 'win32': raise RuntimeError('parent diagnosis requires native Windows')
            diagnostics.mkdir(exist_ok=False)
            runner = load_runner(root)
            target = runner.inventory(root)['footprint-unit-windows-x64']
            ids = runner.python_declarations(root / 'tests', target)
            digest = hashlib.sha256(('\n'.join(ids) + '\n').encode()).hexdigest()
            if len(ids) != 148 or digest != 'f55d1049b896c5b6600fb524d1cadf05a342a37d5d96101720d508936443d50f':
                raise RuntimeError('diagnosis source inventory differs from the required 148 IDs')
            source_paths = ['scripts/ci/run_selected.py', 'scripts/ci/targets.toml',
                            'tests/footprint/test_check.py', 'tests/footprint/test_measure.py',
                            'tests/footprint/test_samplers.py', 'tests/footprint/measure.py',
                            'tests/footprint/samplers/windows.py']
            save(diagnostics / 'inputs.json', {
                'qualification': 'diagnosis-only', 'identity': identity(), 'argv': argv,
                'source_checkout_sha': SOURCE_CHECKOUT_SHA,
                'python': sys.version, 'python_executable': sys.executable,
                'inventory': ids, 'inventory_sha256': digest,
                'sha256': {path: hashlib.sha256((root / path).read_bytes()).hexdigest() for path in source_paths},
            })
            original_execute, commands = runner.execute, []

            def execute(command, cwd, env, stdout_path, stderr_path):
                phase = command[4] if len(command) == 9 and command[3] == '--python-child' else None
                if (phase not in ('discover', 'run') or command[0] != sys.executable or command[1] != '-B'
                        or Path(command[2]).resolve() != expected or command[5] != '--python-spec'
                        or command[7] != '--python-events' or phase in [item['phase'] for item in commands]):
                    raise RuntimeError('unexpected or repeated selected child invocation')
                observed = command
                if phase == 'run':
                    observed = [sys.executable, '-B', str(Path(__file__).resolve()), 'child',
                                '--root', str(root), '--diagnostics', str(diagnostics), '--', *command[2:]]
                item = {'phase': phase, 'original_argv': command, 'observed_argv': observed, 'cwd': str(cwd)}
                commands.append(item)
                save(diagnostics / 'commands.json', commands)
                status = original_execute(observed, cwd, env, stdout_path, stderr_path)
                item['exit'] = status
                save(diagnostics / 'commands.json', commands)
                return status

            runner.execute = execute
            status = 1
            try:
                call_main(runner, argv)
                status = 0
            except SystemExit as error:
                status = error.code if isinstance(error.code, int) else int(error.code is not None)
                raise
            finally:
                runner.execute = original_execute
                save(diagnostics / 'parent-observation.json', {
                    'qualification': 'diagnosis-only', 'wrapper_exit': status,
                    'source_checkout_sha': SOURCE_CHECKOUT_SHA,
                    'phases': [item['phase'] for item in commands], 'identity': identity(),
                })
                if [item['phase'] for item in commands] == ['discover', 'run']:
                    summary = json.loads((diagnostics / 'child-observation.json').read_text(encoding='utf-8'))
                    if summary['observer_errors']:
                        raise RuntimeError('traceback observation failed; original child statuses remain retained')


        def main():
            parser = argparse.ArgumentParser(description=__doc__)
            parser.add_argument('mode', choices=('parent', 'child'))
            parser.add_argument('--root', required=True, type=Path)
            parser.add_argument('--diagnostics', required=True, type=Path)
            command = sys.argv[1:]
            if '--' not in command: parser.error('an unchanged selected-runner argv must follow --')
            split = command.index('--')
            args = parser.parse_args(command[:split])
            argv = command[split + 1:]
            (parent if args.mode == 'parent' else child)(args.root.resolve(), args.diagnostics.resolve(), argv)


        if __name__ == '__main__': main()
        PY
        python - "$RUNNER_TEMP/footprint-windows-observer.py" <<'PY'
        import hashlib, pathlib, sys
        assert hashlib.sha256(pathlib.Path(sys.argv[1]).read_bytes()).hexdigest() == '4cc80a64bdb058172d3af5458561ac05f5e2e54ce674d45a7c2becc63afc6126'
        PY
    - name: Observe the complete Windows selected wrapper once
      shell: bash --noprofile --norc -p -e -o pipefail {0}
      working-directory: .
      run: |
        python -B "$RUNNER_TEMP/footprint-windows-observer.py" parent \
          --root "$PWD" --diagnostics "$RUNNER_TEMP/footprint-windows-diagnosis" -- \
          "$PWD/scripts/ci/run_selected.py" --id footprint-unit-windows-x64 --evidence "$RUNNER_TEMP/evidence"
    - name: Re-verify admitted validator environment after observation
      if: always()
      shell: bash --noprofile --norc -p -e -o pipefail {0}
      working-directory: .
      run: python -I -S -B scripts/ci/python_env.py --check
    - name: Retain all original evidence and separate tracebacks
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: diagnose-footprint-windows-${{ github.run_id }}-${{ github.run_attempt }}
        path: |-
          ${{ runner.temp }}/evidence
          ${{ runner.temp }}/footprint-windows-diagnosis
          ${{ runner.temp }}/admitted/bootstrap-evidence.json
        retention-days: 30
        if-no-files-found: error
        include-hidden-files: false
