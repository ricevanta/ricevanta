name: Server checks

on:
  push:
    branches: [master, 'wip/**']
    paths:
      - 'server/**'
      - 'schemas/dsse/**'
      - 'schemas/events/**'
      - 'schemas/cel/**'
      - 'schemas/export/**'
      - 'schemas/policy/**'
      - '.github/workflows/server.yml'
      - 'schemas/permissions/**'
  pull_request:
    paths:
      - 'server/**'
      - 'schemas/dsse/**'
      - 'schemas/events/**'
      - 'schemas/cel/**'
      - 'schemas/export/**'
      - 'schemas/policy/**'
      - '.github/workflows/server.yml'
      - 'schemas/permissions/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: .github/requirements-design.txt
      - name: Install validation dependencies
        working-directory: .
        run: python -m pip install --disable-pip-version-check -r .github/requirements-design.txt
      - name: Validate ExportDestination schemas and examples
        working-directory: .
        run: |
          python schemas/export/v1alpha1/validate.py
          python schemas/export/v1alpha1/test_validate.py
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - name: Validate permission catalogue
        working-directory: .
        run: |
          python3 -m venv "$RUNNER_TEMP/permission-schema-venv"
          "$RUNNER_TEMP/permission-schema-venv/bin/python" -m pip install 'jsonschema==4.25.1'
          "$RUNNER_TEMP/permission-schema-venv/bin/python" server/internal/authz/catalogue/schema_test.py
      - name: Test
        run: go test -count=1 ./...
      - name: Test with race detector
        run: go test -race -count=1 ./...
      - name: Benchmark key admission
        run: go test -run '^$' -bench '^BenchmarkValidate$' -benchmem -benchtime=100x ./internal/signing/ed25519key
      - name: Vet
        run: go vet ./...

  fuzz-targets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.matrix.outputs.targets }}
    steps:
      - name: Discover fuzz matrix
        id: matrix
        env:
          # Keep this single list aligned with instructions/testing.md.
          FUZZ_TARGETS: >-
            [
              {"package":"./internal/events/eventid","target":"FuzzParse"},
              {"package":"./internal/events/batch","target":"FuzzDescriptor"},
              {"package":"./internal/signing/dsse","target":"FuzzVerify"},
              {"package":"./internal/signing/ed25519key","target":"FuzzValidate"},
              {"package":"./internal/events/wire","target":"FuzzParseHeader"},
              {"package":"./internal/events/wire","target":"FuzzDecode"},
              {"package":"./internal/events/body","target":"FuzzExtractLine"},
              {"package":"./internal/events/body","target":"FuzzDecode"},
              {"package":"./internal/policy/celdecl","target":"FuzzParse"},
              {"package":"./internal/policy/celdecl","target":"FuzzLoad"},
              {"package":"./internal/authz/catalogue","target":"FuzzValidateName"},
              {"package":"./internal/authz/catalogue","target":"FuzzParse"},
              {"package":"./internal/extensions/manifest","target":"FuzzValidate"},
              {"package":"./internal/events/exportdest","target":"FuzzValidate"},
              {"package":"./internal/events/exportdest","target":"FuzzDecoded"},
              {"package":"./internal/mdm/resourcevalidate","target":"FuzzValidate"},
              {"package":"./internal/mdm/resourcevalidate","target":"FuzzBudget"}
            ]
        run: |
          python3 - <<'PY'
          import json
          import os

          targets = json.loads(os.environ['FUZZ_TARGETS'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('targets=' + json.dumps(targets, separators=(',', ':')) + '\n')
          PY

  fuzz:
    needs: fuzz-targets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.fuzz-targets.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum
      - name: Fuzz for 60 seconds
        env:
          FUZZ_PACKAGE: ${{ matrix.package }}
          FUZZ_TARGET: ${{ matrix.target }}
        run: go test "$FUZZ_PACKAGE" -fuzz="^${FUZZ_TARGET}$" -fuzztime=60s -parallel=2
      - name: Upload failing corpus
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: go-fuzz-${{ strategy.job-index }}-${{ matrix.target }}
          path: server/${{ matrix.package }}/testdata/fuzz/${{ matrix.target }}/**
          if-no-files-found: ignore
