    - name: Write successful leaf receipt
      id: proof
      shell: bash
      working-directory: .
      env:
        ROUTE_JSON: ${{ inputs.route }}
        UNIT: loader-gate-b
        CHECKS: '["loader-gate-b-extended"]'
        HOST_OS: ${{ matrix.os }}
      run: |
        python - <<'PY'
        import json, os, pathlib, sys
        sys.path.insert(0, 'scripts/ci')
        import inventory, required
        route = json.loads(os.environ['ROUTE_JSON'])
        unit = os.environ['UNIT']
        if os.environ['HOST_OS']:
            unit += ':' + inventory.HOSTS[os.environ['HOST_OS']]
        item = required.receipt(route, unit, json.loads(os.environ['CHECKS']))
        out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ci-proof'
        out.mkdir()
        (out / 'receipt.json').write_text(json.dumps(item) + '\n')
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write('artifact=' + required.artifact_name(route, unit) + '\n')
        PY
    - name: Upload leaf receipt
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ${{ steps.proof.outputs.artifact }}
        path: ${{ runner.temp }}/ci-proof/receipt.json
        retention-days: 30
        if-no-files-found: error
    if: ${{ contains(fromJSON(inputs.route).groups, 'loader') }}
  ocsf-native:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: server
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-15
          goos: darwin
          goarch: arm64
        - os: windows-2025
          goos: windows
          goarch: amd64
        - os: ubuntu-24.04
          goos: linux
          goarch: amd64
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ fromJSON(inputs.route).testedSha }}
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: 3.14.8
    - name: Assert native receipt host
      shell: bash
      working-directory: .
      env:
        HOST_OS: ${{ matrix.os }}
      run: |
        python - <<'PY'
        import os, platform, sys
        sys.path.insert(0, 'scripts/ci')
        from inventory import HOSTS
        expected = HOSTS[os.environ['HOST_OS']]
        actual = {'Linux': 'linux', 'Windows': 'windows', 'Darwin': 'macos'}[platform.system()]
        arch = {'x86_64': 'x64', 'AMD64': 'x64', 'arm64': 'arm64', 'aarch64': 'arm64'}[platform.machine()]
        assert actual + '-' + arch == expected, (actual, arch, expected)
        PY
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: server/go.mod
        cache: false
    - name: Create fresh Go caches
      shell: bash
      working-directory: .
      run: python -B scripts/ci/fresh_go.py --root "$RUNNER_TEMP/go-fresh" --env-out "$GITHUB_ENV"
    - name: Download and verify Go modules
      shell: bash
      working-directory: server
      run: |
        go mod download
        go mod verify
    - name: Check native target
      shell: bash
      env:
        EXPECTED_GOOS: ${{ matrix.goos }}
        EXPECTED_GOARCH: ${{ matrix.goarch }}
      run: |
        test "$(go env GOOS)" = "$EXPECTED_GOOS"
        test "$(go env GOARCH)" = "$EXPECTED_GOARCH"
    - name: Test OCSF shared corpus
      run: go test -count=1 ./internal/events/ocsf
    - name: Write successful leaf receipt
      id: proof
      shell: bash
      working-directory: .
      env:
        ROUTE_JSON: ${{ inputs.route }}
        UNIT: ocsf
        CHECKS: '["ocsf-native"]'
        HOST_OS: ${{ matrix.os }}
      run: |
        python - <<'PY'
        import json, os, pathlib, sys
        sys.path.insert(0, 'scripts/ci')
        import inventory, required
        route = json.loads(os.environ['ROUTE_JSON'])
        unit = os.environ['UNIT']
        if os.environ['HOST_OS']:
            unit += ':' + inventory.HOSTS[os.environ['HOST_OS']]
        item = required.receipt(route, unit, json.loads(os.environ['CHECKS']))
        out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ci-proof'
        out.mkdir()
        (out / 'receipt.json').write_text(json.dumps(item) + '\n')
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write('artifact=' + required.artifact_name(route, unit) + '\n')
        PY
    - name: Upload leaf receipt
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ${{ steps.proof.outputs.artifact }}
        path: ${{ runner.temp }}/ci-proof/receipt.json
        retention-days: 30
        if-no-files-found: error
    if: ${{ contains(fromJSON(inputs.route).groups, 'ocsf') }}
