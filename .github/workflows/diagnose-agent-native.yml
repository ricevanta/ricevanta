name: Diagnose agent native fixtures
'on':
  push:
    branches:
    - wip/agent-native-fix
permissions:
  contents: read
jobs:
  diagnose-windows-acl:
    name: Diagnose Windows ACL fixtures
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Bootstrap admitted toolchains
      run: python3 -B scripts/ci/bootstrap.py --lock scripts/ci/toolchains.lock.json --platform windows-x64 --tools python,rust --dest "$env:RUNNER_TEMP/admitted" --cache-mode none --env-out "$env:RUNNER_TEMP/tools.env"
    - name: Apply admitted toolchain environment
      run: Get-Content "$env:RUNNER_TEMP/tools.env" | Add-Content $env:GITHUB_ENV
    - name: Admit Cargo downloads and fresh target
      id: cargo
      run: python -B scripts/ci/fresh_go.py --root "$env:RUNNER_TEMP/cargo-fresh" --env-out "$env:GITHUB_ENV" --cargo-home "$env:CARGO_HOME" --cargo-lock "$pwd/agent/Cargo.lock"
    - name: Inspect the fixture with native security descriptor calls
      run: |
        $ErrorActionPreference = 'Stop'
        $out = Join-Path $env:RUNNER_TEMP 'agent-native-diagnosis'
        New-Item -ItemType Directory -Path $out | Out-Null
        Start-Transcript -Path (Join-Path $out 'acl.txt')
        try {
          Add-Type -TypeDefinition @'
        using System;
        using System.Collections.Generic;
        using System.ComponentModel;
        using System.Runtime.InteropServices;
        using System.Security.AccessControl;
        using System.Security.Principal;
        using Microsoft.Win32.SafeHandles;

        public static class NativeAclDiagnosis {
          [DllImport("kernel32.dll", CharSet = CharSet.Unicode, ExactSpelling = true, SetLastError = true)]
          static extern SafeFileHandle CreateFileW(string path, uint access, uint share,
            IntPtr security, uint disposition, uint flags, IntPtr template);
          [DllImport("advapi32.dll")]
          static extern uint GetSecurityInfo(SafeFileHandle handle, uint type, uint info,
            out IntPtr owner, out IntPtr group, out IntPtr dacl, out IntPtr sacl,
            out IntPtr descriptor);
          [DllImport("advapi32.dll", SetLastError = true)]
          [return: MarshalAs(UnmanagedType.Bool)]
          static extern bool GetSecurityDescriptorDacl(IntPtr descriptor,
            [MarshalAs(UnmanagedType.Bool)] out bool present, out IntPtr dacl,
            [MarshalAs(UnmanagedType.Bool)] out bool defaulted);
          [DllImport("kernel32.dll")]
          static extern IntPtr LocalFree(IntPtr allocation);

          public static Dictionary<string, object> Inspect(string path) {
            // Same access, sharing and reparse flags as the production reader.
            using (var handle = CreateFileW(path, 0x20081, 7, IntPtr.Zero, 3,
                                           0x02200000, IntPtr.Zero)) {
              if (handle.IsInvalid) throw new Win32Exception(Marshal.GetLastWin32Error());
              IntPtr owner, group, dacl, sacl, descriptor;
              uint code = GetSecurityInfo(handle, 1, 5, out owner, out group,
                                         out dacl, out sacl, out descriptor);
              if (code != 0) throw new Win32Exception((int)code);
              try {
                bool present, defaulted;
                IntPtr queriedDacl;
                if (!GetSecurityDescriptorDacl(descriptor, out present, out queriedDacl,
                                               out defaulted))
                  throw new Win32Exception(Marshal.GetLastWin32Error());
                var entries = new List<Dictionary<string, object>>();
                if (present && queriedDacl != IntPtr.Zero) {
                  int size = (ushort)Marshal.ReadInt16(queriedDacl, 2);
                  var bytes = new byte[size];
                  Marshal.Copy(queriedDacl, bytes, 0, size);
                  foreach (GenericAce ace in new RawAcl(bytes, 0)) {
                    var entry = new Dictionary<string, object> {
                      {"type", ace.AceType.ToString()}, {"flags", ace.AceFlags.ToString()}
                    };
                    var known = ace as KnownAce;
                    if (known != null) {
                      entry["sid"] = known.SecurityIdentifier.Value;
                      entry["mask"] = known.AccessMask;
                    }
                    entries.Add(entry);
                  }
                }
                return new Dictionary<string, object> {
                  {"path", path}, {"owner", new SecurityIdentifier(owner).Value},
                  {"daclPresent", present}, {"daclNull", queriedDacl == IntPtr.Zero},
                  {"daclDefaulted", defaulted}, {"entries", entries}
                };
              } finally { LocalFree(descriptor); }
            }
          }
        }
        '@
          function Inspect-Acl([string]$path) {
            [NativeAclDiagnosis]::Inspect($path) | ConvertTo-Json -Depth 6
            "pwsh-dotnet-sddl: $((Get-Acl -LiteralPath $path).Sddl)"
          }
          function Invoke-Icacls([string]$path, [string[]]$options) {
            & icacls.exe $path @options
            if ($LASTEXITCODE -ne 0) { throw "icacls failed: $LASTEXITCODE" }
          }
          whoami.exe /user
          if ($LASTEXITCODE -ne 0) { throw 'whoami failed' }
          $root = Join-Path ([System.IO.Path]::GetTempPath()) ('rv-os-windows-diagnosis-' + [guid]::NewGuid().ToString('N'))
          "Fixture temporary parent: $([System.IO.Path]::GetTempPath())"
          New-Item -ItemType Directory -Path $root | Out-Null
          'Root before fixture preparation'
          Inspect-Acl $root
          Invoke-Icacls $root @('/inheritance:r', '/grant', '*S-1-5-18:(OI)(CI)F', '/grant', '*S-1-5-32-544:(OI)(CI)F')
          foreach ($name in @('state', 'run', 'logs')) {
            New-Item -ItemType Directory -Path (Join-Path $root $name) | Out-Null
          }
          $config = Join-Path $root 'agent.json'
          [System.IO.File]::WriteAllText($config, '{}')
          Invoke-Icacls $root @('/setowner', '*S-1-5-32-544', '/T')
          'Prepared fixture root and children'
          foreach ($path in @($root, $config, (Join-Path $root 'state'), (Join-Path $root 'run'), (Join-Path $root 'logs'))) {
            Inspect-Acl $path
          }
          'Apply the existing NULL-DACL fixture recipe'
          $literal = $config.Replace("'", "''")
          $recipe = "`$a = Get-Acl -LiteralPath '$literal'; `$a.SetSecurityDescriptorSddlForm('O:BAD:NO_ACCESS_CONTROL'); Set-Acl -LiteralPath '$literal' -AclObject `$a"
          & powershell.exe -NoProfile -NonInteractive -Command $recipe
          if ($LASTEXITCODE -ne 0) { throw "NULL-DACL setup failed: $LASTEXITCODE" }
          'Windows PowerShell SDDL from the test precondition'
          & powershell.exe -NoProfile -NonInteractive -Command "(Get-Acl -LiteralPath '$literal').Sddl"
          if ($LASTEXITCODE -ne 0) { throw "SDDL query failed: $LASTEXITCODE" }
          Inspect-Acl $config
        } finally {
          Stop-Transcript
        }
    - name: Reproduce unchanged native protection tests
      if: ${{ !cancelled() && steps.cargo.outcome == 'success' }}
      working-directory: agent
      env:
        CARGO_NET_OFFLINE: 'true'
      run: |
        New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/agent-native-diagnosis" | Out-Null
        cargo test --locked --offline -p ricevanta-os-windows --test protection -- --nocapture --test-threads=1 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/agent-native-diagnosis/protection.txt"
        exit $LASTEXITCODE
    - name: Upload native diagnosis evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: diagnose-agent-native-windows-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          ${{ runner.temp }}/agent-native-diagnosis/acl.txt
          ${{ runner.temp }}/agent-native-diagnosis/protection.txt
          ${{ runner.temp }}/admitted/bootstrap-evidence.json
        if-no-files-found: error
        retention-days: 7
