name: Copilot review environment

'on':
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/copilot-code-review.yml'
      - '.github/python-version'
      - '.github/requirements-design.txt'
      - 'scripts/ci/python_env.py'
      - 'scripts/ci/toolchains.lock.json'
      - 'scripts/ci/bootstrap.py'
      - 'scripts/ci/bootstrap/**'
      - 'server/go.mod'
      - 'server/go.sum'
      - 'console/package.json'
      - 'console/pnpm-lock.yaml'
      - 'console/pnpm-workspace.yaml'
      - 'console/.node-version'
      - 'agent/rust-toolchain'
      - 'agent/rust-toolchain.toml'

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bootstrap admitted toolchains
        shell: bash
        working-directory: .
        env:
          CI_PLATFORM: linux-x64
          CI_TOOLS: python,go,rust,node,pnpm
        run: python3 -B scripts/ci/bootstrap.py --lock scripts/ci/toolchains.lock.json --platform "$CI_PLATFORM" --tools "$CI_TOOLS" --dest "$RUNNER_TEMP/admitted" --cache-mode none --env-out "$GITHUB_ENV"
      - name: Verify admitted toolchain evidence
        shell: bash
        working-directory: .
        env:
          CI_PLATFORM: linux-x64
          CI_TOOLS: python,go,rust,node,pnpm
        run: python3 -B scripts/ci/bootstrap/controls.py evidence --lock scripts/ci/toolchains.lock.json --platform "$CI_PLATFORM" --tools "$CI_TOOLS" --evidence "$RUNNER_TEMP/admitted/bootstrap-evidence.json"
      - name: Create fresh Go caches
        shell: bash
        working-directory: .
        run: python -B scripts/ci/fresh_go.py --root "$RUNNER_TEMP/go-fresh" --env-out "$GITHUB_ENV"
      - name: Download and verify Go modules
        shell: bash
        working-directory: server
        run: |
          go mod download
          go mod verify
      - name: Install console dependencies without lifecycle scripts
        working-directory: console
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Create validator environment
        shell: bash
        working-directory: .
        run: python -B scripts/ci/python_env.py --venv "$RUNNER_TEMP/validator" --path-out "$GITHUB_PATH"
      - name: Install hash-locked validator closure
        shell: bash
        working-directory: .
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes --only-binary=:all: -r .github/requirements-design.txt
          python -m pip check
          python -B scripts/ci/python_env.py --check
      - name: Admit Cargo downloads and fresh target
        shell: bash
        working-directory: .
        run: python -B scripts/ci/fresh_go.py --root "$RUNNER_TEMP/cargo-fresh" --env-out "$GITHUB_ENV" --cargo-home "$HOME/.cargo" --cargo-lock "$PWD/agent/Cargo.lock"
      - name: Re-verify validator environment
        shell: bash
        working-directory: .
        run: python -B scripts/ci/python_env.py --check
