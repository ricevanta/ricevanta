name: Copilot review environment

'on':
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/copilot-code-review.yml'
      - '.github/python-version'
      - '.github/requirements-design.txt'
      - 'scripts/ci/python_env.py'
      - 'server/go.mod'
      - 'server/go.sum'
      - 'console/package.json'
      - 'console/pnpm-lock.yaml'
      - 'console/pnpm-workspace.yaml'
      - 'console/.node-version'
      - 'agent/rust-toolchain'
      - 'agent/rust-toolchain.toml'

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .github/python-version
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache: false
      - name: Create fresh Go caches
        shell: bash
        working-directory: .
        run: python -B scripts/ci/fresh_go.py --root "$RUNNER_TEMP/go-fresh" --env-out "$GITHUB_ENV"
      - name: Download and verify Go modules
        shell: bash
        working-directory: server
        run: |
          go mod download
          go mod verify
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.18.0
          run_install: false
          package_json_file: console/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: console/.node-version
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml
      - name: Install console dependencies without lifecycle scripts
        working-directory: console
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Create validator environment
        shell: bash --noprofile --norc -p -e -o pipefail {0}
        working-directory: .
        run: python -B scripts/ci/python_env.py --venv "$RUNNER_TEMP/validator" --path-out "$GITHUB_PATH"
      - name: Install hash-locked validator closure
        shell: bash --noprofile --norc -p -e -o pipefail {0}
        working-directory: .
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes --only-binary=:all: -r .github/requirements-design.txt
          python -m pip check
          python -B scripts/ci/python_env.py --check
      - name: Install Rust
        if: ${{ hashFiles('agent/rust-toolchain', 'agent/rust-toolchain.toml') != '' }}
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Admit Cargo downloads and fresh target
        shell: bash
        working-directory: .
        run: python -B scripts/ci/fresh_go.py --root "$RUNNER_TEMP/cargo-fresh" --env-out "$GITHUB_ENV" --cargo-home "$HOME/.cargo" --cargo-lock "$PWD/agent/Cargo.lock"
      - name: Re-verify validator environment
        shell: bash --noprofile --norc -p -e -o pipefail {0}
        working-directory: .
        run: python -B scripts/ci/python_env.py --check
