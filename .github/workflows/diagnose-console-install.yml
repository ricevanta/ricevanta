name: Diagnose console native installation
'on':
  push:
    branches: [wip/console-install-diagnose]
permissions:
  contents: read
concurrency:
  group: diagnose-console-install-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-install:
    name: diagnose-console-install-${{ matrix.row }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - row: linux-x64-once
            runner: ubuntu-24.04
            platform: linux-x64
            tools: python,node,pnpm,playwright
          - row: macos-arm64-first
            runner: macos-15
            platform: macos-arm64
            tools: python,node,pnpm
          - row: macos-arm64-second
            runner: macos-15
            platform: macos-arm64
            tools: python,node,pnpm
    defaults:
      run:
        shell: bash --noprofile --norc -p -e -o pipefail {0}
    env:
      CI: 'true'
      CI_TOOLS: ${{ matrix.tools }}
      CI_PLATFORM: ${{ matrix.platform }}
      DIAGNOSIS_ROW: ${{ matrix.row }}
    steps:
      - name: Checkout exact diagnosis commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Bootstrap admitted Python Node and pnpm
        run: python3 -B scripts/ci/bootstrap.py --lock scripts/ci/toolchains.lock.json --platform "$CI_PLATFORM" --tools "$CI_TOOLS" --dest "$RUNNER_TEMP/admitted" --cache-mode none --env-out "$RUNNER_TEMP/tools.env"
      - name: Apply admitted environment
        run: cat "$RUNNER_TEMP/tools.env" >> "$GITHUB_ENV"
      - name: Verify admitted toolchain evidence
        run: python3 -B scripts/ci/bootstrap/controls.py evidence --lock scripts/ci/toolchains.lock.json --platform "$CI_PLATFORM" --tools "$CI_TOOLS" --evidence "$RUNNER_TEMP/admitted/bootstrap-evidence.json"
      - name: Isolated fresh install finalization audit and ordinary consumer diagnosis
        run: |
          python -B - <<'PY'
          """Isolated native diagnosis only. No production receipt or browser qualification."""
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import shutil
          import stat
          import subprocess
          import sys
          import tempfile
          import traceback
          
          CHECKOUT = Path.cwd().resolve()
          EVIDENCE = Path(os.environ['RUNNER_TEMP']) / 'console-install-diagnosis'
          EVIDENCE.mkdir(exist_ok=False)
          STAGING = Path(tempfile.mkdtemp(prefix='console-install-fresh-', dir=os.environ['RUNNER_TEMP'])).resolve()
          PROJECT = STAGING / 'project'
          for forbidden in ('node_modules', 'dist', 'src/generated'):
              if (CHECKOUT / 'console' / forbidden).exists():
                  raise RuntimeError(f'checkout contains prior consumer output: {forbidden}')
          shutil.copytree(CHECKOUT, PROJECT, ignore=shutil.ignore_patterns('.git'))
          CONSOLE = PROJECT / 'console'
          COMMANDS = []
          STORE = None
          
          
          def sha(path):
              result = hashlib.sha256()
              with path.open('rb') as source:
                  for chunk in iter(lambda: source.read(1024 * 1024), b''):
                      result.update(chunk)
              return result.hexdigest()
          
          
          def save(name, value):
              (EVIDENCE / name).write_text(json.dumps(value, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          
          
          def snapshot(root):
              entries = {}
              packages = []
              if not root.exists():
                  return {'root': str(root), 'entries': entries, 'packages': packages, 'pairs': []}
              def visit(path):
                  info = path.lstat()
                  relative = path.relative_to(root).as_posix()
                  item = {'mode': stat.S_IMODE(info.st_mode), 'device': info.st_dev, 'inode': info.st_ino}
                  entries[relative] = item
                  if stat.S_ISLNK(info.st_mode):
                      item.update(type='link', target=os.readlink(path), resolved=os.path.realpath(path))
                  elif stat.S_ISDIR(info.st_mode):
                      item['type'] = 'directory'
                      for child in sorted(path.iterdir()):
                          visit(child)
                  elif stat.S_ISREG(info.st_mode):
                      item.update(type='file', sha256=sha(path), bytes=info.st_size)
                      if path.name == 'package.json':
                          value = json.loads(path.read_text(encoding='utf-8'))
                          if isinstance(value, dict) and isinstance(value.get('name'), str) and isinstance(value.get('version'), str):
                              packages.append({'path': relative, 'pair': value['name'] + '@' + value['version'],
                                               'license': value.get('license'), 'os': value.get('os'),
                                               'cpu': value.get('cpu'), 'libc': value.get('libc')})
                  else:
                      item['type'] = 'special'
              visit(root)
              return {'root': str(root), 'entries': entries, 'packages': packages, 'pairs': sorted({item['pair'] for item in packages})}
          
          
          def metadata():
              paths = ['package.json', 'pnpm-workspace.yaml', 'pnpm-lock.yaml', 'node_modules/.modules.yaml',
                       'node_modules/.package-map.json', 'node_modules/.pnpm/lock.yaml',
                       'node_modules/.pnpm-workspace-state-v1.json']
              return {path: sha(CONSOLE / path) if (CONSOLE / path).is_file() else None for path in paths}
          
          
          def checkpoint(name):
              save(name + '-physical.json', snapshot(CONSOLE / 'node_modules'))
              save(name + '-metadata.json', metadata())
              save(name + '-generated-cache.json', snapshot(CONSOLE / '.vite' / 'cache'))
          
          
          def command(name, argv):
              COMMANDS.append({'name': name, 'argv': argv, 'cwd': str(CONSOLE), 'status': 'running'})
              save('commands.json', COMMANDS)
              with (EVIDENCE / (name + '.log')).open('wb') as output:
                  child = subprocess.Popen(argv, cwd=CONSOLE, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
                  assert child.stdout is not None
                  for chunk in iter(lambda: child.stdout.read(65536), b''):
                      output.write(chunk)
                      output.flush()
                      sys.stdout.buffer.write(chunk)
                      sys.stdout.buffer.flush()
                  code = child.wait()
              COMMANDS[-1]['status'] = code
              save('commands.json', COMMANDS)
              if (CONSOLE / 'node_modules').exists():
                  checkpoint(name)
              if code:
                  raise RuntimeError(f'{name} failed with exit {code}; no later consumer may run')
          
          
          def eligible_pairs():
              lock = (CONSOLE / 'pnpm-lock.yaml').read_text(encoding='utf-8')
              block = lock.split('\npackages:\n')[1].split('\nsnapshots:\n')[0]
              packages = {}
              pair = None
              for line in block.splitlines():
                  node = re.fullmatch(r"  '?([^'\s]+)'?:", line)
                  if node:
                      pair = node[1]
                      packages[pair] = {}
                  field = re.fullmatch(r'    (os|cpu|libc): \[(.*)\]', line)
                  if field:
                      packages[pair][field[1]] = [part.strip().strip("'\"") for part in field[2].split(',') if part.strip()]
              def allows(values, target):
                  if not values or values == ['any']:
                      return True
                  if '!' + target in values:
                      return False
                  positive = [value for value in values if not value.startswith('!')]
                  return not positive or target in positive
              eligible = {pair for pair, fields in packages.items() if any(
                  allows(fields.get('os'), osname) and allows(fields.get('cpu'), cpu) and allows(fields.get('libc'), 'glibc')
                  for osname in ('linux', 'darwin', 'win32') for cpu in ('x64', 'arm64'))}
              if len(packages) != 376 or len(eligible) != 342:
                  raise RuntimeError('independent lock identity inventory mismatch')
              save('locked-eligibility.json', {'locked': sorted(packages), 'eligible': sorted(eligible), 'excluded': sorted(set(packages) - eligible)})
              return eligible
          
          
          def preserved(before, after, eligible):
              expected_packages = sorted((item['path'], item['pair']) for item in before['packages'] if item['pair'] in eligible)
              actual_packages = sorted((item['path'], item['pair']) for item in after['packages'])
              if actual_packages != expected_packages or set(after['pairs']) != eligible:
                  raise RuntimeError('independent after identity/instance set mismatch')
              candidates = [str(Path(item['path']).parent) for item in before['packages'] if item['pair'] not in eligible]
              directories = {path.split('/node_modules/')[0] for path in candidates}
              root = Path(before['root'])
              expected = {}
              def content(item):
                  return {key: item[key] for key in ('type', 'mode', 'sha256', 'target') if key in item}
              for path, item in before['entries'].items():
                  if any(path == directory or path.startswith(directory + '/') for directory in directories):
                      continue
                  if item['type'] == 'link' and any(item['resolved'] == str(root / candidate) for candidate in candidates):
                      continue
                  expected[path] = content(item)
              actual = {path: content(item) for path, item in after['entries'].items()}
              if expected != actual:
                  save('retained-difference.json', {'missing': sorted(set(expected) - set(actual)), 'extra': sorted(set(actual) - set(expected)),
                                                   'changed': sorted(path for path in set(expected) & set(actual) if expected[path] != actual[path])})
                  raise RuntimeError('independent retained files/links/modes changed')
              save('retained-proof.json', {'eligible_instances': expected_packages, 'retained_entries': expected})
          
          
          def package_snapshot(value):
              # Compare all installation entries, excluding only outputs validated by the independent audit.
              roots = ('.cache', '.vite-temp', '.vue-global-types')
              entries = {path: item for path, item in value['entries'].items()
                         if not any(path == root or path.startswith(root + '/') for root in roots)}
              return {'entries': entries, 'packages': value['packages'], 'pairs': value['pairs']}
          
          
          def post_consumer_audit(name, baseline, immutable):
              command(name + '-physical-inventory', ['node', '--input-type=module', '-e',
                  "import { installedPackages } from './scripts/installed-packages.ts'; console.log(JSON.stringify(installedPackages(), null, 2))"])
              command(name + '-dependency-audit', ['pnpm', 'audit:deps'])
              current = snapshot(CONSOLE / 'node_modules')
              if package_snapshot(current) != package_snapshot(baseline):
                  save(name + '-package-difference.json', {'before': package_snapshot(baseline), 'after': package_snapshot(current)})
                  raise RuntimeError('eligible installation instances or metadata changed across consumer: ' + name)
              if metadata() != immutable:
                  raise RuntimeError('immutable pnpm metadata changed across consumer: ' + name)
          
          
          # Query the same full frozen set with the existing scanner and preserve complete batch responses,
          # including pagination. This extra diagnosis does not change production OSV matching or exceptions.
          OSV = r"""
          import { readFileSync, writeFileSync } from 'node:fs'
          import { lockedPackages, scanOSV } from './scripts/audit-deps.ts'
          const lockfile = readFileSync('pnpm-lock.yaml', 'utf8')
          const locked = lockedPackages(lockfile)
          const pages = []
          const findings = new Map(locked.map(p => [p.name + '@' + p.version, new Set()]))
          const completed = new Set()
          try {
            const diagnostics = await scanOSV(locked, async body => {
              const response = await fetch('https://api.osv.dev/v1/querybatch', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body), signal:AbortSignal.timeout(30000)})
              if (!response.ok) throw new Error('OSV HTTP ' + response.status)
              const result = await response.json()
              pages.push({request:body,response:result})
              for (let i = 0; i < body.queries.length; i++) {
                const query = body.queries[i], row = result.results?.[i]
                if (!row) continue
                const pair = query.package.name + '@' + query.version
                for (const finding of row.vulns ?? []) findings.get(pair)?.add(finding.id)
                if (!row.next_page_token) completed.add(pair)
              }
              return result
            }, {lockfile,manifest:JSON.parse(readFileSync('package.json','utf8')),exceptionsText:readFileSync('security/osv-exceptions.json','utf8')})
            if (locked.length !== 376 || completed.size !== 376) throw new Error('Incomplete pair dispositions')
            const dispositions = locked.map(p => { const pair=p.name+'@'+p.version; const ids=[...findings.get(pair)].sort(); return {pair,complete:completed.has(pair),advisories:ids,disposition:ids.length?'see exact exception/path diagnostics':'clean'} })
            console.log(JSON.stringify({dispositions,diagnostics},null,2))
          } finally { writeFileSync(process.env.CONSOLE_OSV_PAGES, JSON.stringify(pages,null,2)+'\n') }
          """
          
          status = 1
          try:
              save('host.json', {'platform': sys.platform, 'machine': os.uname().machine, 'project': str(CONSOLE),
                                 'sha': os.environ.get('GITHUB_SHA'), 'job': os.environ.get('DIAGNOSIS_ROW'), 'python': sys.version, 'python_executable': sys.executable})
              save('input-source-hashes.json', {str(path.relative_to(PROJECT)): sha(path) for path in sorted((CONSOLE / 'scripts').glob('*.ts'))})
              save('input-metadata.json', metadata())
              eligible = eligible_pairs()
              command('node-version', ['node', '--version'])
              command('pnpm-version', ['pnpm', '--version'])
              command('frozen-install', ['pnpm', 'install', '--frozen-lockfile'])
              before = snapshot(CONSOLE / 'node_modules')
              before_metadata = metadata()
              modules = json.loads((CONSOLE / 'node_modules/.modules.yaml').read_text(encoding='utf-8'))
              STORE = Path(modules['storeDir']).resolve(strict=True)
              store_before = snapshot(STORE)
              save('before-store.json', store_before)
              command('before-list', ['pnpm', 'list', '--depth', 'Infinity', '--json'])
              command('before-licenses', ['pnpm', 'licenses', 'list', '--json'])
              command('finalize', ['node', 'scripts/finalize-install.ts'])
              after = snapshot(CONSOLE / 'node_modules')
              preserved(before, after, eligible)
              if metadata() != before_metadata:
                  raise RuntimeError('immutable install metadata changed')
              store_after = snapshot(STORE)
              save('after-store.json', store_after)
              if store_before != store_after:
                  raise RuntimeError('pnpm store changed during finalization')
              command('repeat-finalize', ['node', 'scripts/finalize-install.ts'])
              command('after-list', ['pnpm', 'list', '--depth', 'Infinity', '--json'])
              command('after-licenses', ['pnpm', 'licenses', 'list', '--json'])
              command('initial-physical-inventory', ['node', '--input-type=module', '-e', "import { installedPackages } from './scripts/installed-packages.ts'; console.log(JSON.stringify(installedPackages(), null, 2))"])
              command('independent-audit', ['pnpm', 'audit:deps'])
              os.environ['CONSOLE_OSV_PAGES'] = str(EVIDENCE / 'osv-pages.json')
              command('complete-osv-dispositions', ['node', '--input-type=module', '-e', OSV])
              # These ordinary consumers expose generated node_modules artifacts and audit-dist's later audit.
              baseline = snapshot(CONSOLE / 'node_modules')
              immutable = metadata()
              for name in ('typecheck', 'lint', 'format:check', 'build'):
                  label = 'consumer-' + name.replace(':', '-')
                  command(label, ['pnpm', name])
                  post_consumer_audit(label, baseline, immutable)
              command('consumer-build-output-audit', ['node', 'scripts/audit-dist.ts'])
              post_consumer_audit('after-build-output-audit', baseline, immutable)
              if sys.platform == 'linux':
                  if not os.environ.get('PLAYWRIGHT_BROWSERS_PATH'):
                      raise RuntimeError('admitted Chromium evidence/path required for Linux component consumer')
                  for name in ('test:unit', 'test:component'):
                      label = 'consumer-' + name.replace(':', '-')
                      argv = ['pnpm', name]
                      if name == 'test:unit':
                          argv.extend(['--reporter=default', '--reporter=json',
                                       '--outputFile.json=' + str(EVIDENCE / 'consumer-test-unit.json')])
                      command(label, argv)
                      post_consumer_audit(label, baseline, immutable)
              post_consumer_audit('terminal-independent', baseline, immutable)
              status = 0
          except BaseException as error:
              save('failure.json', {'error': repr(error), 'traceback': traceback.format_exc()})
              raise
          finally:
              checkpoint('terminal')
              if STORE is not None:
                  save('terminal-store.json', snapshot(STORE))
              save('status.json', {'status': status, 'commands': COMMANDS, 'qualification': 'isolated native install diagnosis only',
                                   'unqualified': ['production workflow consumers', 'browser gates', 'Windows installation', 'release support']})
              print('Native diagnosis evidence: ' + str(EVIDENCE), flush=True)
          PY
      - name: Retain diagnosis artifacts after success or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diagnose-console-install-${{ matrix.row }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/console-install-diagnosis
            ${{ runner.temp }}/admitted/bootstrap-evidence.json
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
