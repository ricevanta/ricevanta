name: Console checks
'on':
  workflow_call:
    inputs:
      route:
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: console
    env:
      CI: 'true'
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ fromJSON(inputs.route).testedSha }}
    - name: Bootstrap admitted toolchains
      shell: bash --noprofile --norc -p -e -o pipefail {0}
      working-directory: .
      env:
        CI_PLATFORM: linux-x64
        CI_TOOLS: python,node,pnpm,playwright
      run: python3 -B scripts/ci/bootstrap.py --lock scripts/ci/toolchains.lock.json --platform "$CI_PLATFORM" --tools "$CI_TOOLS" --dest "$RUNNER_TEMP/admitted" --cache-mode none --env-out "$RUNNER_TEMP/tools.env"
    - name: Apply admitted toolchain environment
      shell: bash --noprofile --norc -p -e -o pipefail {0}
      working-directory: .
      run: cat "$RUNNER_TEMP/tools.env" >> "$GITHUB_ENV"
    - name: Verify admitted toolchain evidence
      shell: bash --noprofile --norc -p -e -o pipefail {0}
      working-directory: .
      env:
        CI_PLATFORM: linux-x64
        CI_TOOLS: python,node,pnpm,playwright
      run: python3 -B scripts/ci/bootstrap/controls.py evidence --lock scripts/ci/toolchains.lock.json --platform "$CI_PLATFORM" --tools "$CI_TOOLS" --evidence "$RUNNER_TEMP/admitted/bootstrap-evidence.json"
    - name: Record admitted browser builds
      shell: bash --noprofile --norc -p -e -o pipefail {0}
      run: |
        node --version
        pnpm --version
        ls -1 "$PLAYWRIGHT_BROWSERS_PATH"
    - name: Frozen install
      shell: bash --noprofile --norc -p -e -o pipefail {0}
      run: pnpm install --frozen-lockfile
    - name: Type check
      shell: bash --noprofile --norc -p -e -o pipefail {0}
      run: pnpm typecheck
    - name: Lint
      shell: bash --noprofile --norc -p -e -o pipefail {0}
      run: pnpm lint
    - name: Format check
      shell: bash --noprofile --norc -p -e -o pipefail {0}
      run: pnpm format:check
    - name: Dependency audit
      shell: bash --noprofile --norc -p -e -o pipefail {0}
      run: pnpm audit:deps
    - name: Unit tests
      shell: bash --noprofile --norc -p -e -o pipefail {0}
      run: python -B scripts/ci/run_selected.py --id console-unit --evidence "$RUNNER_TEMP/evidence"
      working-directory: .
    - name: Component tests
      shell: bash --noprofile --norc -p -e -o pipefail {0}
      run: python -B scripts/ci/run_selected.py --id console-component --evidence "$RUNNER_TEMP/evidence"
      working-directory: .
    - name: Production build
      shell: bash --noprofile --norc -p -e -o pipefail {0}
      run: pnpm build
    - name: Reproducibility
      shell: bash --noprofile --norc -p -e -o pipefail {0}
      run: pnpm check:reproducible
    - name: Compute console dist digest
      id: dist
      shell: bash --noprofile --norc -p -e -o pipefail {0}
      working-directory: .
      run: |
        digest=$(python -B scripts/ci/tree_digest.py --root console/dist)
        printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
    - name: Enforcing CSP, Chromium and Firefox
      shell: bash --noprofile --norc -p -e -o pipefail {0}
      run: python -B scripts/ci/run_selected.py --id console-csp --evidence "$RUNNER_TEMP/evidence"
      working-directory: .
    - name: Bundle manifest
      shell: bash --noprofile --norc -p -e -o pipefail {0}
      run: cat dist/.vite/manifest.json
    - name: Bounded properties
      shell: bash --noprofile --norc -p -e -o pipefail {0}
      run: python -B scripts/ci/run_selected.py --id console-fuzz --evidence "$RUNNER_TEMP/evidence"
      working-directory: .
    - name: Recheck console dist
      shell: bash --noprofile --norc -p -e -o pipefail {0}
      working-directory: .
      env:
        EXPECTED_DIST_DIGEST: ${{ steps.dist.outputs.digest }}
      run: python -B scripts/ci/tree_digest.py --root console/dist --expect-env EXPECTED_DIST_DIGEST
    - name: Upload console dist
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: console-dist-${{ github.run_id }}-${{ github.run_attempt }}
        path: console/dist
        include-hidden-files: true
        if-no-files-found: error
        overwrite: false
        retention-days: 1
    - name: Upload console reports
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: console-reports-${{ github.run_id }}-${{ github.run_attempt }}-linux-x64
        path: |
          ${{ runner.temp }}/evidence
          console/test-results
          console/playwright-report
        include-hidden-files: false
        retention-days: 30
        if-no-files-found: warn
    - name: Write successful leaf receipt
      id: proof
      shell: bash --noprofile --norc -p -e -o pipefail {0}
      working-directory: .
      env:
        ROUTE_JSON: ${{ inputs.route }}
        UNIT: console
        CHECKS: '["console-install", "console-typecheck", "console-lint", "console-format", "console-audit", "console-unit", "console-component", "console-build", "console-reproducible", "console-csp", "console-fuzz"]'
        HOST_OS: ''
      run: |
        python - <<'PY'
        import json, os, pathlib, sys
        sys.path.insert(0, 'scripts/ci')
        import inventory, required
        route = json.loads(os.environ['ROUTE_JSON'])
        unit = os.environ['UNIT']
        if os.environ['HOST_OS']:
            unit += ':' + inventory.HOSTS[os.environ['HOST_OS']]
        item = required.receipt(route, unit, json.loads(os.environ['CHECKS']), pathlib.Path(os.environ['RUNNER_TEMP']) / 'evidence')
        out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ci-proof'
        out.mkdir()
        (out / 'receipt.json').write_text(json.dumps(item) + '\n')
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write('artifact=' + required.artifact_name(route, unit) + '\n')
        PY
    - name: Upload leaf receipt
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ${{ steps.proof.outputs.artifact }}
        path: ${{ runner.temp }}/ci-proof/receipt.json
        retention-days: 30
        if-no-files-found: error
    outputs:
      dist-digest: ${{ steps.dist.outputs.digest }}
  webkit:
    runs-on: macos-15
    needs: validate
    timeout-minutes: 20
    defaults:
      run:
        working-directory: console
    env:
      CI: 'true'
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ fromJSON(inputs.route).testedSha }}
    - name: Bootstrap admitted toolchains
      shell: bash --noprofile --norc -p -e -o pipefail {0}
      working-directory: .
      env:
        CI_PLATFORM: macos-arm64
        CI_TOOLS: python,node,pnpm,playwright
      run: python3 -B scripts/ci/bootstrap.py --lock scripts/ci/toolchains.lock.json --platform "$CI_PLATFORM" --tools "$CI_TOOLS" --dest "$RUNNER_TEMP/admitted" --cache-mode none --env-out "$RUNNER_TEMP/tools.env"
    - name: Apply admitted toolchain environment
      shell: bash --noprofile --norc -p -e -o pipefail {0}
      working-directory: .
      run: cat "$RUNNER_TEMP/tools.env" >> "$GITHUB_ENV"
    - name: Verify admitted toolchain evidence
      shell: bash --noprofile --norc -p -e -o pipefail {0}
      working-directory: .
      env:
        CI_PLATFORM: macos-arm64
        CI_TOOLS: python,node,pnpm,playwright
      run: python3 -B scripts/ci/bootstrap/controls.py evidence --lock scripts/ci/toolchains.lock.json --platform "$CI_PLATFORM" --tools "$CI_TOOLS" --evidence "$RUNNER_TEMP/admitted/bootstrap-evidence.json"
    - name: Frozen install
      shell: bash --noprofile --norc -p -e -o pipefail {0}
      run: pnpm install --frozen-lockfile
    - name: Dependency audit
      shell: bash --noprofile --norc -p -e -o pipefail {0}
      run: pnpm audit:deps
    - name: Prepare fresh console dist
      shell: bash --noprofile --norc -p -e -o pipefail {0}
      working-directory: .
      run: |
        test ! -e console/dist
        mkdir console/dist
    - name: Download console dist
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: console-dist-${{ github.run_id }}-${{ github.run_attempt }}
        path: console/dist
    - name: Verify console dist
      shell: bash --noprofile --norc -p -e -o pipefail {0}
      working-directory: .
      env:
        EXPECTED_DIST_DIGEST: ${{ needs.validate.outputs.dist-digest }}
      run: python -B scripts/ci/tree_digest.py --root console/dist --expect-env EXPECTED_DIST_DIGEST
    - name: Enforcing CSP, WebKit
      shell: bash --noprofile --norc -p -e -o pipefail {0}
      working-directory: .
      run: python -B scripts/ci/run_selected.py --id console-csp-webkit --evidence "$RUNNER_TEMP/evidence"
    - name: Upload console reports
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: console-reports-${{ github.run_id }}-${{ github.run_attempt }}-macos-arm64
        path: |
          ${{ runner.temp }}/evidence
          console/test-results
          console/playwright-report
        include-hidden-files: false
        retention-days: 30
        if-no-files-found: warn
    - name: Write successful leaf receipt
      id: proof
      shell: bash --noprofile --norc -p -e -o pipefail {0}
      working-directory: .
      env:
        ROUTE_JSON: ${{ inputs.route }}
        UNIT: console-webkit:macos-arm64
        CHECKS: '["console-install", "console-audit", "console-dist", "console-csp-webkit"]'
        HOST_OS: ''
      run: |
        python - <<'PY'
        import json, os, pathlib, sys
        sys.path.insert(0, 'scripts/ci')
        import inventory, required
        route = json.loads(os.environ['ROUTE_JSON'])
        unit = os.environ['UNIT']
        if os.environ['HOST_OS']:
            unit += ':' + inventory.HOSTS[os.environ['HOST_OS']]
        item = required.receipt(route, unit, json.loads(os.environ['CHECKS']), pathlib.Path(os.environ['RUNNER_TEMP']) / 'evidence')
        out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ci-proof'
        out.mkdir()
        (out / 'receipt.json').write_text(json.dumps(item) + '\n')
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write('artifact=' + required.artifact_name(route, unit) + '\n')
        PY
    - name: Upload leaf receipt
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ${{ steps.proof.outputs.artifact }}
        path: ${{ runner.temp }}/ci-proof/receipt.json
        retention-days: 30
        if-no-files-found: error
