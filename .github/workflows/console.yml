name: Console checks
'on':
  workflow_call:
    inputs:
      route:
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: console
    env:
      CI: 'true'
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ fromJSON(inputs.route).testedSha }}
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: 3.14.8
    - name: Set up pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      with:
        version: 11.18.0
        run_install: false
        package_json_file: console/package.json
    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version-file: console/.node-version
        cache: pnpm
        cache-dependency-path: console/pnpm-lock.yaml
    - name: Frozen install
      run: pnpm install --frozen-lockfile
    - name: Type check
      run: pnpm typecheck
    - name: Lint
      run: pnpm lint
    - name: Format check
      run: pnpm format:check
    - name: Dependency audit
      run: pnpm audit:deps
    - name: Unit tests
      run: pnpm test:unit
    - name: Install browser engines
      run: pnpm exec playwright install --with-deps chromium firefox webkit
    - name: Component tests
      run: pnpm test:component
    - name: Production build
      run: pnpm build
    - name: Reproducibility
      run: pnpm check:reproducible
    - name: Enforcing CSP, Chromium, Firefox and WebKit
      run: pnpm test:csp
    - name: Bundle manifest
      run: cat dist/.vite/manifest.json
    - name: Bounded properties
      run: pnpm test:fuzz
    - name: Write successful leaf receipt
      id: proof
      shell: bash
      working-directory: .
      env:
        ROUTE_JSON: ${{ inputs.route }}
        UNIT: console
        CHECKS: '["console-install", "console-typecheck", "console-lint", "console-format", "console-audit", "console-unit",
          "console-component", "console-build", "console-reproducible", "console-csp", "console-fuzz"]'
        HOST_OS: ''
      run: |
        python - <<'PY'
        import json, os, pathlib, sys
        sys.path.insert(0, 'scripts/ci')
        import inventory, required
        route = json.loads(os.environ['ROUTE_JSON'])
        unit = os.environ['UNIT']
        if os.environ['HOST_OS']:
            unit += ':' + inventory.HOSTS[os.environ['HOST_OS']]
        item = required.receipt(route, unit, json.loads(os.environ['CHECKS']))
        out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ci-proof'
        out.mkdir()
        (out / 'receipt.json').write_text(json.dumps(item) + '\n')
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write('artifact=' + required.artifact_name(route, unit) + '\n')
        PY
    - name: Upload leaf receipt
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ${{ steps.proof.outputs.artifact }}
        path: ${{ runner.temp }}/ci-proof/receipt.json
        retention-days: 30
        if-no-files-found: error
