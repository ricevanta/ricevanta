name: Console checks
'on':
  push:
    branches: [master]
    paths:
      - console/**
      - branding/BRAND_SPEC.md
      - branding/dist/**
      - docs/design/console.md
      - docs/specs/console-foundation.md
      - docs/plans/console-foundation.md
      - instructions/vue.md
      - instructions/testing.md
      - docs/licensing.md
      - .github/workflows/console.yml
  pull_request:
    paths:
      - console/**
      - branding/BRAND_SPEC.md
      - branding/dist/**
      - docs/design/console.md
      - docs/specs/console-foundation.md
      - docs/plans/console-foundation.md
      - instructions/vue.md
      - instructions/testing.md
      - docs/licensing.md
      - .github/workflows/console.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: console-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: console
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.18.0
          run_install: false
          package_json_file: console/package.json
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: console/.node-version
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm format:check
      - name: Dependency audit
        run: pnpm audit:deps
      - name: Unit tests
        run: pnpm test:unit
      - name: Install browser engines
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Component tests
        run: pnpm test:component
      - name: Production build
        run: pnpm build
      - name: Reproducibility
        run: pnpm check:reproducible
      - name: Enforcing CSP, Chromium, Firefox and WebKit
        run: pnpm test:csp
      - name: Bundle manifest
        run: cat dist/.vite/manifest.json
