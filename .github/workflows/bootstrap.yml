name: Bootstrap contracts
'on':
  workflow_call:
    inputs:
      route:
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-24.04
          tools: python,go,rust,node,pnpm,playwright
        - os: windows-2025
          tools: python,go,rust
        - os: macos-15
          tools: python,go,rust
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ fromJSON(inputs.route).testedSha }}
    - name: Reject corrupted payloads before any extraction or execution
      shell: bash
      working-directory: .
      env:
        CI_PLATFORM: '${{ fromJSON(''{"ubuntu-24.04":"linux-x64","windows-2025":"windows-x64","macos-15":"macos-arm64"}'')[matrix.os] }}'
        CI_TOOLS: ${{ matrix.tools }}
      run: python3 -B scripts/ci/bootstrap/controls.py corrupt --lock scripts/ci/toolchains.lock.json --platform "$CI_PLATFORM" --tools "$CI_TOOLS" --work "$RUNNER_TEMP/bootstrap-controls"
    - name: Bootstrap admitted toolchains
      shell: bash
      working-directory: .
      env:
        CI_PLATFORM: '${{ fromJSON(''{"ubuntu-24.04":"linux-x64","windows-2025":"windows-x64","macos-15":"macos-arm64"}'')[matrix.os] }}'
        CI_TOOLS: ${{ matrix.tools }}
      run: python3 -B scripts/ci/bootstrap.py --lock scripts/ci/toolchains.lock.json --platform "$CI_PLATFORM" --tools "$CI_TOOLS" --dest "$RUNNER_TEMP/admitted" --cache-mode none --env-out "$RUNNER_TEMP/tools.env"
    - name: Apply admitted toolchain environment
      shell: bash
      working-directory: .
      run: cat "$RUNNER_TEMP/tools.env" >> "$GITHUB_ENV"
    - name: Verify admitted toolchain evidence
      shell: bash
      working-directory: .
      env:
        CI_PLATFORM: '${{ fromJSON(''{"ubuntu-24.04":"linux-x64","windows-2025":"windows-x64","macos-15":"macos-arm64"}'')[matrix.os] }}'
        CI_TOOLS: ${{ matrix.tools }}
      run: python3 -B scripts/ci/bootstrap/controls.py evidence --lock scripts/ci/toolchains.lock.json --platform "$CI_PLATFORM" --tools "$CI_TOOLS" --evidence "$RUNNER_TEMP/admitted/bootstrap-evidence.json"
    - name: Assert native receipt host
      shell: bash
      working-directory: .
      env:
        HOST_OS: ${{ matrix.os }}
      run: |
        python - <<'PY'
        import os, platform, sys
        sys.path.insert(0, 'scripts/ci')
        from inventory import HOSTS
        expected = HOSTS[os.environ['HOST_OS']]
        actual = {'Linux': 'linux', 'Windows': 'windows', 'Darwin': 'macos'}[platform.system()]
        arch = {'x86_64': 'x64', 'AMD64': 'x64', 'arm64': 'arm64', 'aarch64': 'arm64'}[platform.machine()]
        assert actual + '-' + arch == expected, (actual, arch, expected)
        PY
    - name: Record runner compilers, SDKs and admitted tool versions
      shell: bash
      working-directory: .
      run: |
        echo "image ${ImageOS:-?} ${ImageVersion:-?}"
        git --version
        case "$RUNNER_OS" in
          Linux) cc --version; ldd --version | head -1;;
          macOS) cc --version; xcodebuild -version; sw_vers;;
          Windows) pwsh -File agent/tools/check-msvc.ps1;;
        esac
        # bootstrap.py executed every admitted tool once and logged its version; this records the PATH resolution.
        command -v python; python --version
        command -v go; go version
        command -v rustc; rustc -vV; cargo -V; rustfmt --version; cargo-clippy --version
        if [ "$RUNNER_OS" = Linux ]; then ls "$PLAYWRIGHT_BROWSERS_PATH"; fi
    - name: Create fresh Go caches
      shell: bash
      working-directory: .
      run: python -B scripts/ci/fresh_go.py --root "$RUNNER_TEMP/go-fresh" --env-out "$GITHUB_ENV"
    - name: Download and verify Go modules
      shell: bash
      working-directory: server
      run: |
        go mod download
        go mod verify
    - name: Create validator environment
      shell: bash
      working-directory: .
      run: python -B scripts/ci/python_env.py --venv "$RUNNER_TEMP/validator" --path-out "$GITHUB_PATH"
    - name: Install hash-locked validator closure
      shell: bash
      working-directory: .
      run: |
        python -m pip install --disable-pip-version-check --no-cache-dir --require-hashes --only-binary=:all: -r .github/requirements-design.txt
        python -m pip check
        python -B scripts/ci/python_env.py --check
    - name: Contract unit tests
      run: python -B -m unittest discover -s scripts/ci -p 'test_*.py' -v
    - name: CI schema fixtures
      shell: bash
      run: |
        python - <<'PY'
        import json
        from jsonschema import Draft202012Validator
        schema = json.load(open('schemas/ci/v1/contracts.schema.json'))
        Draft202012Validator.check_schema(schema)
        for example in json.load(open('schemas/ci/v1/examples.json')):
            Draft202012Validator(schema).validate(example)
        Draft202012Validator(schema).validate(json.load(open('scripts/ci/toolchains.lock.json')))
        PY
    - name: Upload bootstrap evidence
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: bootstrap-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.os }}
        path: ${{ runner.temp }}/admitted/bootstrap-evidence.json
        retention-days: 30
        if-no-files-found: error
    - name: Re-verify validator environment
      shell: bash
      working-directory: .
      run: python -B scripts/ci/python_env.py --check
    - name: Write successful leaf receipt
      id: proof
      shell: bash
      working-directory: .
      env:
        ROUTE_JSON: ${{ inputs.route }}
        UNIT: bootstrap
        CHECKS: '["bootstrap-host", "bootstrap-controls", "bootstrap-cold-install", "ci-unit", "ci-schema"]'
        HOST_OS: ${{ matrix.os }}
      run: |
        python - <<'PY'
        import json, os, pathlib, sys
        sys.path.insert(0, 'scripts/ci')
        import inventory, required
        route = json.loads(os.environ['ROUTE_JSON'])
        unit = os.environ['UNIT']
        if os.environ['HOST_OS']:
            unit += ':' + inventory.HOSTS[os.environ['HOST_OS']]
        item = required.receipt(route, unit, json.loads(os.environ['CHECKS']))
        out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ci-proof'
        out.mkdir()
        (out / 'receipt.json').write_text(json.dumps(item) + '\n')
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write('artifact=' + required.artifact_name(route, unit) + '\n')
        PY
    - name: Upload leaf receipt
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ${{ steps.proof.outputs.artifact }}
        path: ${{ runner.temp }}/ci-proof/receipt.json
        retention-days: 30
        if-no-files-found: error
