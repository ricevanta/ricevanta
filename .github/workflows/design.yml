name: Design checks
'on':
  workflow_call:
    inputs:
      route:
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
        ref: ${{ fromJSON(inputs.route).testedSha }}
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: 3.14.8
        cache: pip
        cache-dependency-path: .github/requirements-design.txt
    - name: Install validation dependencies
      run: python -m pip install --disable-pip-version-check -r .github/requirements-design.txt
    - name: Validate permission catalogue
      run: python server/internal/authz/catalogue/schema_test.py
    - name: Check catalogue compatibility against the reviewed base
      shell: bash
      working-directory: .
      env:
        BASE_SHA: ${{ fromJSON(inputs.route).baseSha }}
        CANDIDATE_SHA: ${{ fromJSON(inputs.route).testedSha }}
      run: python -B scripts/ci/catalogue_compat.py --root . --base-sha "$BASE_SHA" --candidate-sha "$CANDIDATE_SHA"
    - name: Validate OCSF sources, schemas and events
      env:
        PYTHONDONTWRITEBYTECODE: '1'
      run: |
        python - <<'PY'
        from importlib.metadata import version
        expected = {
            'jsonschema': '4.25.1', 'PyYAML': '6.0.3', 'attrs': '26.1.0',
            'jsonschema-specifications': '2025.9.1', 'referencing': '0.37.0',
            'rpds-py': '2026.6.3', 'typing-extensions': '4.16.0',
        }
        for name, pin in expected.items():
            if version(name) != pin:
                raise SystemExit('validation dependency pin mismatch: ' + name)
        PY
        python schemas/ocsf/generate.py --check
        python schemas/ocsf/validate.py
        python -m unittest discover -s schemas/ocsf -p 'test_*.py' -v
    - name: Validate permission source coverage
      continue-on-error: true
      working-directory: .
      run: python server/internal/authz/catalogue/schema_test.py --check-sources
    - name: Validate policy schemas and examples
      run: |
        python schemas/policy/v1alpha1/validate.py
        python schemas/policy/v1alpha1/test_validate.py
    - name: release-contracts
      id: release-contracts
      run: |
        python -B - <<'PY'
        import unittest

        suite = unittest.defaultTestLoader.discover('scripts/release', pattern='test_*.py')
        expected = suite.countTestCases()
        if expected == 0:
            raise SystemExit('release-contracts: no tests discovered')
        result = unittest.TextTestRunner(verbosity=2).run(suite)
        print(f'release-contracts: {result.testsRun} tests executed, {expected} discovered', flush=True)
        if not result.wasSuccessful() or result.skipped or result.testsRun != expected:
            raise SystemExit('release-contracts: failed, skipped or missing tests')
        PY
    - name: Validate fixture contracts
      run: |
        python scripts/ci/validate_contracts.py
        python scripts/ci/test_key_admission_contract.py
        python -m unittest discover -s scripts/ci -p test_validate_contracts.py
        python -B -m unittest discover -s scripts/ci -p test_triggers.py -v
    - name: Validate ExportDestination schemas and examples
      run: |
        python schemas/export/v1alpha1/validate.py
        python schemas/export/v1alpha1/test_validate.py
    - name: Validate ReportTemplate schemas and examples
      run: |
        python schemas/report/v1alpha1/validate.py
        python schemas/report/v1alpha1/test_validate.py
    - name: Check document limits and agent definitions
      run: |
        python - <<'PY'
        import pathlib
        import tomllib

        oversized = []
        for directory in ('docs/design', 'docs/specs'):
            for path in pathlib.Path(directory).glob('*.md'):
                count = len(path.read_text().splitlines())
                if count > 400:
                    oversized.append(f'{path}: {count} lines (limit 400)')
        plan = pathlib.Path('docs/plans/export-destination-schema.md')
        count = len(plan.read_text().splitlines())
        if count > 400:
            oversized.append(f'{plan}: {count} lines (limit 400)')
        if oversized:
            raise SystemExit('\n'.join(oversized))
        for path in pathlib.Path('.codex/agents').glob('*.toml'):
            tomllib.loads(path.read_text())
        print('Design/spec line limits and agent TOML syntax passed')
        PY
    - name: Validate CI schema examples
      run: |
        python - <<'PY'
        import json
        from jsonschema import Draft202012Validator
        schema = json.load(open('schemas/ci/v1/contracts.schema.json'))
        Draft202012Validator.check_schema(schema)
        for example in json.load(open('schemas/ci/v1/examples.json')):
            Draft202012Validator(schema).validate(example)
        PY
    - name: Write successful leaf receipt
      id: proof
      shell: bash
      working-directory: .
      env:
        ROUTE_JSON: ${{ inputs.route }}
        UNIT: design
        CHECKS: '["ocsf-schemas", "policy-schemas", "export-schemas", "report-schemas", "permission-schema", "fixture-contracts",
          "ci-schema", "document-limits", "release-contracts", "catalogue-compat"]'
        HOST_OS: ''
      run: |
        python - <<'PY'
        import json, os, pathlib, sys
        sys.path.insert(0, 'scripts/ci')
        import inventory, required
        route = json.loads(os.environ['ROUTE_JSON'])
        unit = os.environ['UNIT']
        if os.environ['HOST_OS']:
            unit += ':' + inventory.HOSTS[os.environ['HOST_OS']]
        item = required.receipt(route, unit, json.loads(os.environ['CHECKS']))
        out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ci-proof'
        out.mkdir()
        (out / 'receipt.json').write_text(json.dumps(item) + '\n')
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write('artifact=' + required.artifact_name(route, unit) + '\n')
        PY
    - name: Upload leaf receipt
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ${{ steps.proof.outputs.artifact }}
        path: ${{ runner.temp }}/ci-proof/receipt.json
        retention-days: 30
        if-no-files-found: error
