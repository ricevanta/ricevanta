openapi: 3.1.2
info:
  title: Ricevanta administration API
  version: '1.3'
  summary: The /api/v1 contract used by the console, the ricevanta CLI and GitOps.
  description: >-
    Hand-written contract under BE-05 and BE-16. Rules that every operation follows
    (strict JSON, problem details, pagination, concurrency, idempotency, credentials and
    the x-ricevanta-authorization binding) are defined in docs/specs/api-foundation.md.
    Identity and session operations follow docs/specs/identity-login.md and
    docs/specs/identity-sessions.md; the change stream follows docs/specs/change-stream.md.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: /
tags:
  - name: platform
  - name: auth
  - name: session
  - name: sessions
  - name: api-tokens
  - name: identity-providers
  - name: principal-links
  - name: break-glass
  - name: approvals
  - name: setup
  - name: changes
security:
  - session: []
  - token: []
paths:
  /api/v1/openapi.yaml:
    get:
      operationId: getOpenApiDocument
      x-ricevanta-gates: [BE-12]
      tags: [platform]
      summary: Return this document.
      security:
        - session: []
        - token: []
      x-ricevanta-authorization:
        principal: permission
        credentials: [session, token]
        permissions:
          - {name: platform.api.read, uses: getOpenApiDocument}
        reauth: none
        csrf: none
      responses:
        '200':
          description: The embedded document bytes.
          content:
            application/yaml:
              schema: {type: string, maxLength: 1048576}
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/auth/options:
    get:
      operationId: listLoginOptions
      x-ricevanta-gates: [BE-12]
      tags: [auth]
      summary: List the enabled login methods for the login page.
      security: []
      x-ricevanta-authorization:
        principal: public
        reauth: none
        csrf: none
      responses:
        '200':
          description: Enabled providers and whether break-glass login is enabled.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginOptions'}
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/auth/oidc/{provider_uid}/start:
    get:
      operationId: startOidcLogin
      x-ricevanta-gates: [BE-12]
      tags: [auth]
      summary: Start an OIDC authorization code flow with PKCE as a top-level navigation.
      security: []
      parameters:
        - $ref: '#/components/parameters/ProviderUid'
        - $ref: '#/components/parameters/ReturnTo'
      x-ricevanta-authorization:
        principal: public
        reauth: none
        csrf: navigation
      responses:
        '303':
          $ref: '#/components/responses/NavigationRedirect'
  /api/v1/auth/oidc/{provider_uid}/callback:
    get:
      operationId: completeOidcLogin
      x-ricevanta-gates: [BE-12]
      tags: [auth]
      summary: Receive the authorization response and create or re-authenticate a session.
      security: []
      parameters:
        - $ref: '#/components/parameters/ProviderUid'
        - {name: code, in: query, required: false, schema: {type: string, minLength: 1, maxLength: 2048}}
        - {name: state, in: query, required: false, schema: {type: string, minLength: 1, maxLength: 128}}
        - {name: iss, in: query, required: false, schema: {type: string, minLength: 1, maxLength: 2048}}
        - {name: error, in: query, required: false, schema: {type: string, minLength: 1, maxLength: 128}}
        - {name: error_description, in: query, required: false, schema: {type: string, maxLength: 1024}}
      x-ricevanta-authorization:
        principal: protocol
        protocol: oidc_callback
        reauth: none
        csrf: navigation_callback
      responses:
        '303':
          $ref: '#/components/responses/NavigationRedirect'
  /api/v1/auth/saml/{provider_uid}/start:
    get:
      operationId: startSamlLogin
      x-ricevanta-gates: [BE-12]
      tags: [auth]
      summary: Start an SP-initiated SAML login with the HTTP-Redirect binding.
      security: []
      parameters:
        - $ref: '#/components/parameters/ProviderUid'
        - $ref: '#/components/parameters/ReturnTo'
      x-ricevanta-authorization:
        principal: public
        reauth: none
        csrf: navigation
      responses:
        '303':
          $ref: '#/components/responses/NavigationRedirect'
  /api/v1/auth/saml/{provider_uid}/acs:
    post:
      operationId: completeSamlLogin
      x-ricevanta-concurrency: not_versioned
      x-ricevanta-gates: [BE-12]
      tags: [auth]
      summary: Assertion consumer service for the HTTP-POST binding.
      security: []
      parameters:
        - $ref: '#/components/parameters/ProviderUid'
      x-ricevanta-authorization:
        principal: protocol
        protocol: saml_acs
        reauth: none
        csrf: cross_site_post
      x-ricevanta-max-body-bytes: 262144
      x-ricevanta-idempotency: not_supported
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              required: [SAMLResponse]
              properties:
                SAMLResponse: {type: string, minLength: 1, maxLength: 262000}
                RelayState: {type: string, maxLength: 80}
      responses:
        '303':
          $ref: '#/components/responses/NavigationRedirect'
  /api/v1/auth/saml/{provider_uid}/metadata:
    get:
      operationId: getSamlServiceProviderMetadata
      x-ricevanta-gates: [BE-12]
      tags: [auth]
      summary: Service-provider metadata for configuring the identity provider.
      security: []
      parameters:
        - $ref: '#/components/parameters/ProviderUid'
      x-ricevanta-authorization:
        principal: public
        reauth: none
        csrf: none
      responses:
        '200':
          description: SAML 2.0 metadata with the entity ID, ACS URL and SP certificate.
          content:
            application/samlmetadata+xml:
              schema: {type: string, maxLength: 65536}
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/auth/local:
    post:
      operationId: loginLocal
      x-ricevanta-concurrency: not_versioned
      x-ricevanta-gates: [BE-12]
      tags: [auth]
      summary: Break-glass login with user name, generated password and TOTP code.
      security: []
      x-ricevanta-authorization:
        principal: protocol
        protocol: local_login
        reauth: none
        csrf: origin
      x-ricevanta-max-body-bytes: 4096
      x-ricevanta-idempotency: not_supported
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LocalLoginRequest'}
      responses:
        '200':
          description: Session created; the response sets the session cookie.
          headers:
            Set-Cookie: {$ref: '#/components/headers/SetSessionCookie'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/auth/local/enrollment:
    post:
      operationId: startBreakGlassEnrollment
      x-ricevanta-concurrency: not_versioned
      x-ricevanta-gates: [BE-12]
      tags: [auth]
      summary: Exchange a one-time enrollment code for the generated password and TOTP seed.
      security: []
      x-ricevanta-authorization:
        principal: protocol
        protocol: enrollment_code
        reauth: none
        csrf: origin
      x-ricevanta-max-body-bytes: 4096
      x-ricevanta-idempotency: not_supported
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BreakGlassEnrollmentStart'}
      responses:
        '200':
          description: Credentials shown once; the response sets the enrollment cookie.
          headers:
            Set-Cookie: {$ref: '#/components/headers/SetEnrollmentCookie'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BreakGlassEnrollmentChallenge'}
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/auth/local/enrollment/complete:
    post:
      operationId: completeBreakGlassEnrollment
      x-ricevanta-concurrency: not_versioned
      x-ricevanta-gates: [BE-12]
      tags: [auth]
      summary: Confirm the TOTP seed with a first code and activate the account.
      security: []
      x-ricevanta-authorization:
        principal: protocol
        protocol: enrollment_challenge
        reauth: none
        csrf: origin
      x-ricevanta-max-body-bytes: 1024
      x-ricevanta-idempotency: not_supported
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BreakGlassEnrollmentComplete'}
      responses:
        '204':
          description: Account active; the enrollment cookie is cleared. No session is created.
          headers:
            Set-Cookie: {$ref: '#/components/headers/ClearEnrollmentCookie'}
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/setup:
    post:
      operationId: completeFirstStartSetup
      x-ricevanta-concurrency: not_versioned
      tags: [setup]
      summary: Consume the one-time setup token and create the first break-glass administrator.
      security: []
      x-ricevanta-authorization:
        principal: protocol
        protocol: setup_token
        reauth: none
        csrf: origin
      x-ricevanta-gates: [BE-12]
      x-ricevanta-max-body-bytes: 4096
      x-ricevanta-idempotency: not_supported
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SetupRequest'}
      responses:
        '200':
          description: First administrator created; credentials shown once.
          headers:
            Set-Cookie: {$ref: '#/components/headers/SetEnrollmentCookie'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BreakGlassEnrollmentChallenge'}
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/session:
    get:
      operationId: getSession
      x-ricevanta-gates: [BE-12]
      tags: [session]
      summary: Return the current session, effective permissions and CSRF token.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/Background'
      x-ricevanta-authorization:
        principal: subject
        credentials: [session]
        reauth: none
        csrf: none
      responses:
        '200':
          description: Current session.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/session/logout:
    post:
      operationId: logout
      x-ricevanta-concurrency: not_versioned
      x-ricevanta-gates: [BE-12]
      tags: [session]
      summary: End the current session.
      security:
        - session: []
          csrf: []
      x-ricevanta-authorization:
        principal: subject
        credentials: [session]
        reauth: none
        csrf: synchronizer
      x-ricevanta-idempotency: not_supported
      responses:
        '204':
          description: Session ended; the cookie is cleared.
          headers:
            Set-Cookie: {$ref: '#/components/headers/ClearSessionCookie'}
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/session/reauth/oidc/{provider_uid}/start:
    get:
      operationId: startOidcReauthentication
      x-ricevanta-gates: [BE-12]
      tags: [session]
      summary: Start a forced OIDC re-authentication for the current session.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/ProviderUid'
        - $ref: '#/components/parameters/ReturnTo'
        - $ref: '#/components/parameters/ReauthPurpose'
      x-ricevanta-authorization:
        principal: subject
        credentials: [session]
        reauth: none
        csrf: navigation
      responses:
        '303':
          $ref: '#/components/responses/NavigationRedirect'
  /api/v1/session/reauth/saml/{provider_uid}/start:
    get:
      operationId: startSamlReauthentication
      x-ricevanta-gates: [BE-12]
      tags: [session]
      summary: Start a SAML re-authentication with ForceAuthn for the current session.
      security:
        - session: []
      parameters:
        - $ref: '#/components/parameters/ProviderUid'
        - $ref: '#/components/parameters/ReturnTo'
        - $ref: '#/components/parameters/ReauthPurpose'
      x-ricevanta-authorization:
        principal: subject
        credentials: [session]
        reauth: none
        csrf: navigation
      responses:
        '303':
          $ref: '#/components/responses/NavigationRedirect'
  /api/v1/session/reauth/local:
    post:
      operationId: reauthenticateLocal
      x-ricevanta-concurrency: not_versioned
      x-ricevanta-gates: [BE-12]
      tags: [session]
      summary: Re-authenticate a break-glass session with password and a fresh TOTP code.
      security:
        - session: []
          csrf: []
      x-ricevanta-authorization:
        principal: subject
        credentials: [session]
        reauth: none
        csrf: synchronizer
      x-ricevanta-max-body-bytes: 4096
      x-ricevanta-idempotency: not_supported
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LocalReauthRequest'}
      responses:
        '200':
          description: Session re-authenticated and rotated; the response sets the new cookie.
          headers:
            Set-Cookie: {$ref: '#/components/headers/SetSessionCookie'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/sessions:
    get:
      operationId: listSessions
      x-ricevanta-gates: [BE-12]
      tags: [sessions]
      summary: List active sessions.
      security:
        - session: []
        - token: []
      parameters:
        - {name: user_uid, in: query, required: false, schema: {$ref: '#/components/schemas/Uid'}}
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageToken'
        - $ref: '#/components/parameters/Background'
      x-ricevanta-authorization:
        principal: permission
        credentials: [session, token]
        permissions:
          - {name: identity.sessions.read, uses: listSessions}
        reauth: none
        csrf: none
      responses:
        '200':
          description: One page of sessions.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionPage'}
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/sessions/{session_uid}/revoke:
    post:
      operationId: revokeSession
      x-ricevanta-concurrency: not_versioned
      x-ricevanta-gates: [BE-12]
      tags: [sessions]
      summary: Revoke one session immediately.
      security:
        - session: []
          csrf: []
        - token: []
      parameters:
        - $ref: '#/components/parameters/SessionUid'
      x-ricevanta-authorization:
        principal: permission
        credentials: [session, token]
        permissions:
          - {name: identity.sessions.revoke, uses: revokeSession}
        reauth: none
        csrf: synchronizer
      x-ricevanta-idempotency: not_supported
      responses:
        '204':
          description: Revoked, or already ended.
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/users/{user_uid}/sessions/revoke:
    post:
      operationId: revokeUserSessions
      x-ricevanta-concurrency: not_versioned
      x-ricevanta-gates: [BE-12]
      tags: [sessions]
      summary: Revoke every session of one user immediately.
      security:
        - session: []
          csrf: []
        - token: []
      parameters:
        - $ref: '#/components/parameters/UserUid'
      x-ricevanta-authorization:
        principal: permission
        credentials: [session, token]
        permissions:
          - {name: identity.sessions.revoke, uses: revokeUserSessions}
        reauth: none
        csrf: synchronizer
      x-ricevanta-idempotency: not_supported
      responses:
        '200':
          description: Number of sessions revoked.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RevokedCount'}
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/api-tokens:
    get:
      operationId: listApiTokens
      x-ricevanta-gates: [BE-12]
      tags: [api-tokens]
      summary: List the caller's API tokens, or every token with owner=all.
      security:
        - session: []
        - token: []
      parameters:
        - {name: owner, in: query, required: false, schema: {type: string, enum: [me, all], default: me}}
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageToken'
        - $ref: '#/components/parameters/Background'
      x-ricevanta-authorization:
        principal: permission
        credentials: [session, token]
        permissions:
          - {name: identity.tokens.read, uses: 'listApiTokens#own', selector: own}
          - {name: identity.tokens.manage, uses: 'listApiTokens#all', selector: all}
        reauth: none
        csrf: none
      responses:
        '200':
          description: One page of token metadata; secrets are never returned.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiTokenPage'}
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createApiToken
      x-ricevanta-concurrency: not_versioned
      tags: [api-tokens]
      summary: Create a scoped API token; the secret is returned once.
      security:
        - session: []
          csrf: []
      x-ricevanta-authorization:
        principal: permission
        credentials: [session]
        permissions:
          - {name: identity.tokens.create, uses: createApiToken}
        reauth: recent
        csrf: synchronizer
      x-ricevanta-gates: [BE-12]
      x-ricevanta-max-body-bytes: 65536
      x-ricevanta-idempotency: not_supported
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApiTokenCreate'}
      responses:
        '201':
          description: Token created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiTokenCreated'}
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/api-tokens/{token_uid}/revoke:
    post:
      operationId: revokeApiToken
      x-ricevanta-concurrency: not_versioned
      x-ricevanta-gates: [BE-12]
      tags: [api-tokens]
      summary: Revoke an API token immediately.
      security:
        - session: []
          csrf: []
        - token: []
      parameters:
        - $ref: '#/components/parameters/TokenUid'
      x-ricevanta-authorization:
        principal: permission
        credentials: [session, token]
        permissions:
          - {name: identity.tokens.revoke, uses: 'revokeApiToken#own', selector: own}
          - {name: identity.tokens.manage, uses: 'revokeApiToken#other', selector: other}
        reauth: none
        csrf: synchronizer
      x-ricevanta-idempotency: not_supported
      responses:
        '204':
          description: Revoked, or already revoked.
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/identity-providers:
    get:
      operationId: listIdentityProviders
      x-ricevanta-gates: [BE-12]
      tags: [identity-providers]
      summary: List configured identity providers; client secrets read back as has_client_secret.
      security:
        - session: []
        - token: []
      parameters:
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageToken'
        - $ref: '#/components/parameters/Background'
      x-ricevanta-authorization:
        principal: permission
        credentials: [session, token]
        permissions:
          - {name: identity.providers.read, uses: listIdentityProviders}
        reauth: none
        csrf: none
      responses:
        '200':
          description: One page of providers.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IdentityProviderPage'}
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createIdentityProvider
      x-ricevanta-concurrency: not_versioned
      tags: [identity-providers]
      summary: Request a new OIDC or SAML provider; always an identity-authority approval.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      x-ricevanta-authorization:
        principal: permission
        credentials: [session]
        permissions:
          - {name: identity.providers.create, uses: createIdentityProvider}
        reauth: recent
        csrf: synchronizer
      x-ricevanta-gates: [BE-12]
      x-ricevanta-max-body-bytes: 327680
      x-ricevanta-idempotency: required
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IdentityProviderInput'}
      responses:
        '202':
          $ref: '#/components/responses/ApprovalAccepted'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/identity-providers/{provider_uid}:
    put:
      operationId: updateIdentityProvider
      x-ricevanta-concurrency: if_match
      tags: [identity-providers]
      summary: Request a change to a provider; always an identity-authority approval.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/ProviderUid'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      x-ricevanta-authorization:
        principal: permission
        credentials: [session]
        permissions:
          - {name: identity.providers.update, uses: updateIdentityProvider}
        reauth: recent
        csrf: synchronizer
      x-ricevanta-gates: [BE-12]
      x-ricevanta-max-body-bytes: 327680
      x-ricevanta-idempotency: required
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IdentityProviderInput'}
      responses:
        '202':
          $ref: '#/components/responses/ApprovalAccepted'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: deleteIdentityProvider
      x-ricevanta-concurrency: if_match
      tags: [identity-providers]
      summary: Request deletion of a provider and its links; always an identity-authority approval.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/ProviderUid'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      x-ricevanta-authorization:
        principal: permission
        credentials: [session]
        permissions:
          - {name: identity.providers.delete, uses: deleteIdentityProvider}
        reauth: recent
        csrf: synchronizer
      x-ricevanta-gates: [BE-12]
      x-ricevanta-idempotency: required
      x-ricevanta-max-body-bytes: 8192
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/JustificationRequest'}
      responses:
        '202':
          $ref: '#/components/responses/ApprovalAccepted'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/principal-links:
    get:
      operationId: listPrincipalLinks
      x-ricevanta-gates: [BE-12]
      tags: [principal-links]
      summary: List links between external principals and internal users.
      security:
        - session: []
        - token: []
      parameters:
        - {name: user_uid, in: query, required: false, schema: {$ref: '#/components/schemas/Uid'}}
        - {name: provider_uid, in: query, required: false, schema: {$ref: '#/components/schemas/Uid'}}
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/PageToken'
        - $ref: '#/components/parameters/Background'
      x-ricevanta-authorization:
        principal: permission
        credentials: [session, token]
        permissions:
          - {name: identity.principal_links.read, uses: listPrincipalLinks}
        reauth: none
        csrf: none
      responses:
        '200':
          description: One page of links.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PrincipalLinkPage'}
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createPrincipalLink
      x-ricevanta-concurrency: not_versioned
      tags: [principal-links]
      summary: Request a link from a pending link request to an internal user.
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      x-ricevanta-authorization:
        principal: permission
        credentials: [session]
        permissions:
