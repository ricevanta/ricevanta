  /api/v1/changes:
    get:
      operationId: streamChanges
      description: >-
        Authority expires no later than five seconds after observation starts. An
        independent watchdog hard-aborts the raw TCP connection at the earliest stream
        deadline, including pending writes and every shared HTTP/2 sibling. Write progress
        cannot extend the lease. Pinned-runtime and deployment transport qualification
        under change-stream section 6 is required; terminating proxies need a proved
        downstream abort fence. Reconnect starts a full snapshot, never mutation replay.
      x-ricevanta-gates: [BE-12]
      tags: [changes]
      summary: Server-Sent Events stream of per-topic invalidation tokens; never row data.
      security:
        - session: []
        - token: []
      parameters:
        - $ref: '#/components/parameters/Topic'
        - $ref: '#/components/parameters/Background'
      x-ricevanta-authorization:
        principal: subject
        credentials: [session, token]
        reauth: none
        csrf: none
      responses:
        '200':
          description: An event stream; see docs/specs/change-stream.md for the framing.
          content:
            text/event-stream:
              schema: {type: string}
              x-ricevanta-events:
                - {event: snapshot, data: {$ref: '#/components/schemas/ChangeSnapshot'}}
                - {event: change, data: {$ref: '#/components/schemas/ChangeEvent'}}
                - {event: session, data: {$ref: '#/components/schemas/SessionEvent'}}
                - {event: reconnect, data: {$ref: '#/components/schemas/ReconnectEvent'}}
        default:
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-rv_session
      description: Server-side session from OIDC, SAML or break-glass login.
    csrf:
      type: apiKey
      in: header
      name: X-Ricevanta-CSRF
      description: Synchronizer token from getSession; required with the session on unsafe methods.
    token:
      type: http
      scheme: bearer
      bearerFormat: rvt_
      description: Scoped API token; never combined with a session cookie.
  parameters:
    ProviderUid:
      {name: provider_uid, in: path, required: true, schema: {$ref: '#/components/schemas/Uid'}}
    SessionUid:
      {name: session_uid, in: path, required: true, schema: {$ref: '#/components/schemas/Uid'}}
    UserUid:
      {name: user_uid, in: path, required: true, schema: {$ref: '#/components/schemas/Uid'}}
    TokenUid:
      {name: token_uid, in: path, required: true, schema: {$ref: '#/components/schemas/Uid'}}
    LinkUid:
      {name: link_uid, in: path, required: true, schema: {$ref: '#/components/schemas/Uid'}}
    AccountUid:
      {name: account_uid, in: path, required: true, schema: {$ref: '#/components/schemas/Uid'}}
    RequestUid:
      {name: request_uid, in: path, required: true, schema: {$ref: '#/components/schemas/Uid'}}
    PageSize:
      {name: page_size, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 500, default: 50}}
    PageToken:
      {name: page_token, in: query, required: false, schema: {$ref: '#/components/schemas/PageToken'}}
    ReturnTo:
      {name: return_to, in: query, required: false, schema: {$ref: '#/components/schemas/ReturnPath'}}
    ReauthPurpose:
      name: purpose
      in: query
      required: false
      schema: {$ref: '#/components/schemas/ReauthPurpose'}
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: {type: string, pattern: '^"r[1-9][0-9]{0,18}"$', maxLength: 22}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, pattern: '^[A-Za-z0-9_-]{16,64}$', minLength: 16, maxLength: 64}
    Background:
      name: X-Ricevanta-Background
      in: header
      required: false
      description: Marks a request that must not extend the idle timeout.
      schema: {type: string, enum: ['1']}
    Topic:
      name: topic
      in: query
      required: true
      style: form
      explode: true
      schema:
        type: array
        minItems: 1
        maxItems: 16
        uniqueItems: true
        items: {$ref: '#/components/schemas/Topic'}
  headers:
    Location:
      required: true
      schema: {type: string, maxLength: 2048}
    SetSessionCookie:
      description: __Host-rv_session; Secure; HttpOnly; Path=/; SameSite=Strict, no Domain and no Max-Age.
      schema: {type: string, maxLength: 256}
    ClearSessionCookie:
      description: __Host-rv_session with an empty value and Max-Age=0 and the same attributes.
      schema: {type: string, maxLength: 256}
    SetEnrollmentCookie:
      description: __Host-rv_enroll; Secure; HttpOnly; Path=/; SameSite=Strict; Max-Age=600.
      schema: {type: string, maxLength: 256}
    ClearEnrollmentCookie:
      description: __Host-rv_enroll with an empty value and Max-Age=0.
      schema: {type: string, maxLength: 256}
    RetryAfter:
      schema: {type: integer, minimum: 1, maximum: 86400}
  responses:
    Problem:
      description: RFC 9457 problem details.
      headers:
        Retry-After: {$ref: '#/components/headers/RetryAfter'}
        WWW-Authenticate:
          description: Present on 401 responses.
          schema: {type: string, maxLength: 512}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    ApprovalAccepted:
      description: The protected action became a pending approval request.
      headers:
        Location: {$ref: '#/components/headers/Location'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApprovalRequest'}
    NavigationRedirect:
      description: >-
        303 See Other to the provider, to a validated same-origin return path, or to
        /login?error=<code> with a code from LoginErrorCode. May set or clear the pre-login
        and session cookies.
      headers:
        Location: {$ref: '#/components/headers/Location'}
        Set-Cookie:
          description: Pre-login, session or clearing cookies as defined in docs/specs/identity-login.md.
          schema: {type: string, maxLength: 1024}
  schemas:
    Uid:
      type: string
      description: Lowercase UUIDv7 (docs/specs/core-primitives.md).
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      minLength: 36
      maxLength: 36
    Timestamp:
      type: string
      format: date-time
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,9})?Z$'
      maxLength: 30
    Sha256:
      type: string
      pattern: '^sha256:[0-9a-f]{64}$'
      maxLength: 71
    PageToken:
      type: string
      pattern: '^[A-Za-z0-9_-]{1,512}$'
      maxLength: 512
    ReturnPath:
      type: string
      description: Same-origin console path; validation rules in docs/specs/identity-login.md section 2.
      pattern: '^/[A-Za-z0-9._~/-]{0,511}$'
      maxLength: 512
    ReauthPurpose:
      type: string
      pattern: '^(general|approval:[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12})$'
      maxLength: 45
    Topic:
      type: string
      pattern: '^(devices|alerts|dlp\.findings|approvals|enrollments|certificates|certificates\.infrastructure|rollouts|extensions|exports|(device|alert|commands)/[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12})$'
      maxLength: 45
    PermissionName:
      type: string
      pattern: '^[a-z][a-z0-9_]{0,31}\.[a-z][a-z0-9_]{0,31}\.[a-z][a-z0-9_]{0,31}$'
      minLength: 5
      maxLength: 98
    DisplayName:
      type: string
      minLength: 1
      maxLength: 128
    Username:
      type: string
      pattern: '^[a-z][a-z0-9._-]{2,63}$'
      minLength: 3
      maxLength: 64
    Problem:
      type: object
      required: [type, title, status, request_id]
      properties:
        type:
          type: string
          enum:
            - https://ricevanta.io/problems/validation_failed
            - https://ricevanta.io/problems/unauthenticated
            - https://ricevanta.io/problems/reauth_required
            - https://ricevanta.io/problems/invalid_credentials
            - https://ricevanta.io/problems/permission_denied
            - https://ricevanta.io/problems/csrf_rejected
            - https://ricevanta.io/problems/credentials_ambiguous
            - https://ricevanta.io/problems/not_found
            - https://ricevanta.io/problems/method_not_allowed
            - https://ricevanta.io/problems/conflict
            - https://ricevanta.io/problems/approval_stale
            - https://ricevanta.io/problems/idempotency_in_progress
            - https://ricevanta.io/problems/precondition_failed
            - https://ricevanta.io/problems/payload_too_large
            - https://ricevanta.io/problems/unsupported_media_type
            - https://ricevanta.io/problems/idempotency_key_reused
            - https://ricevanta.io/problems/precondition_required
            - https://ricevanta.io/problems/rate_limited
            - https://ricevanta.io/problems/internal_error
            - https://ricevanta.io/problems/unavailable
            - https://ricevanta.io/problems/recovery_sealed
        title: {type: string, minLength: 1, maxLength: 128}
        status: {type: integer, minimum: 400, maximum: 599}
        detail: {type: string, maxLength: 512}
        instance:
          type: string
          pattern: '^urn:uuid:[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
        request_id: {$ref: '#/components/schemas/Uid'}
        errors:
          type: array
          maxItems: 64
          items: {$ref: '#/components/schemas/FieldError'}
        permission: {$ref: '#/components/schemas/PermissionName'}
        retry_after_seconds: {type: integer, minimum: 1, maximum: 86400}
        reauth: {$ref: '#/components/schemas/ReauthChallenge'}
    FieldError:
      type: object
      required: [pointer, code]
      properties:
        pointer: {type: string, maxLength: 256, description: RFC 6901 JSON Pointer into the request body, or a parameter name prefixed with '#'.}
        code:
          type: string
          enum: [required, type, format, range, length, pattern, enum, unknown_field, duplicate_key, too_many_items, too_deep, invalid]
    ReauthChallenge:
      type: object
      required: [max_age_seconds, binding, allowed_methods]
      properties:
        max_age_seconds: {type: integer, const: 600}
        binding: {type: string, enum: [none, approval]}
        request_uid: {$ref: '#/components/schemas/Uid'}
        allowed_methods:
          type: array
          maxItems: 33
          items: {$ref: '#/components/schemas/AuthMethodRef'}
    AuthMethodRef:
      type: object
      required: [method]
      allOf:
        - if: {properties: {method: {const: local}}}
          then:
            required: [account_uid]
            not: {required: [provider_uid]}
          else:
            required: [provider_uid]
            not: {required: [account_uid]}
      properties:
        method: {type: string, enum: [oidc, saml, local]}
        provider_uid: {$ref: '#/components/schemas/Uid'}
        account_uid: {$ref: '#/components/schemas/Uid'}
        display_name: {$ref: '#/components/schemas/DisplayName'}
    LoginErrorCode:
      type: string
      description: Value of the error query parameter on /login after a failed navigation.
      enum: [provider_error, state_mismatch, expired, invalid_response, no_link, link_pending, user_disabled, provider_disabled, cross_site_start, rate_limited, unavailable, reauth_user_mismatch, reauth_stale, session_required]
    LoginOptions:
      type: object
      required: [providers, local_login]
      properties:
        providers:
          type: array
          maxItems: 32
          items:
            type: object
            required: [uid, display_name, protocol]
            properties:
              uid: {$ref: '#/components/schemas/Uid'}
              display_name: {$ref: '#/components/schemas/DisplayName'}
              protocol: {type: string, enum: [oidc, saml]}
        local_login: {type: boolean}
    PermissionGrant:
      type: object
      required: [name, scope]
      properties:
        name: {$ref: '#/components/schemas/PermissionName'}
        scope:
          type: object
          required: [kind]
          allOf:
            - if: {properties: {kind: {const: device_groups}}}
              then: {required: [device_groups]}
              else: {not: {required: [device_groups]}}
          properties:
            kind: {type: string, enum: [all, device_groups]}
            device_groups:
              type: array
              minItems: 1
              maxItems: 1024
              uniqueItems: true
              items: {$ref: '#/components/schemas/Uid'}
    Session:
      type: object
      required: [session_uid, user, kind, authentication, csrf_token, permissions, idle_timeout_seconds, idle_expires_at, absolute_expires_at, server_version, recovery_epoch, approval_policies_disabled, recovery_quorum]
      properties:
        session_uid: {$ref: '#/components/schemas/Uid'}
        user:
          type: object
          required: [uid, display_name]
          properties:
            uid: {$ref: '#/components/schemas/Uid'}
            display_name: {$ref: '#/components/schemas/DisplayName'}
        kind: {type: string, enum: [sso, break_glass]}
        authentication:
          type: object
          required: [method]
          properties:
            method: {type: string, enum: [oidc, saml, local]}
            provider_uid: {$ref: '#/components/schemas/Uid'}
            authenticated_at: {$ref: '#/components/schemas/Timestamp'}
            reauthenticated_at: {$ref: '#/components/schemas/Timestamp'}
            reauth_method: {$ref: '#/components/schemas/AuthMethodRef'}
            reauth_binding: {$ref: '#/components/schemas/ReauthPurpose'}
        csrf_token: {type: string, pattern: '^[A-Za-z0-9_-]{43}$'}
        permissions:
          type: array
          maxItems: 2048
          items: {$ref: '#/components/schemas/PermissionGrant'}
        locale: {type: string, enum: [en, vi]}
        idle_timeout_seconds: {type: integer, minimum: 120, maximum: 3600}
        idle_expires_at: {$ref: '#/components/schemas/Timestamp'}
        absolute_expires_at: {$ref: '#/components/schemas/Timestamp'}
        server_version: {type: string, maxLength: 64}
        recovery_epoch: {type: string, pattern: '^[1-9][0-9]{0,19}$'}
        approval_policies_disabled: {type: boolean}
        recovery_quorum:
          type: object
          required: [threshold, custodians]
          properties:
            threshold: {type: integer, minimum: 1, maximum: 16}
            custodians: {type: integer, minimum: 1, maximum: 16}
    LocalLoginRequest:
      type: object
      additionalProperties: false
      required: [username, password, totp_code]
      properties:
        username: {$ref: '#/components/schemas/Username'}
        password: {type: string, minLength: 1, maxLength: 64}
        totp_code: {type: string, pattern: '^[0-9]{6}$', maxLength: 6}
    LocalReauthRequest:
      type: object
      additionalProperties: false
      required: [account_uid, password, totp_code, purpose]
      properties:
        account_uid: {$ref: '#/components/schemas/Uid'}
        password: {type: string, minLength: 1, maxLength: 64}
        totp_code: {type: string, pattern: '^[0-9]{6}$', maxLength: 6}
        purpose: {$ref: '#/components/schemas/ReauthPurpose'}
    BreakGlassEnrollmentStart:
      type: object
      additionalProperties: false
      required: [enrollment_code]
      properties:
        enrollment_code: {type: string, pattern: '^[A-Z2-7]{26}$', maxLength: 26}
    BreakGlassEnrollmentChallenge:
      type: object
      required: [enrollment_uid, username, mode, totp, expires_at]
      properties:
        mode: {type: string, enum: [create, reset, replace_factor]}
        enrollment_uid: {$ref: '#/components/schemas/Uid'}
        username: {$ref: '#/components/schemas/Username'}
        password: {type: string, pattern: '^[A-Z2-7]{24}$', description: Generated, 120 bits, shown once.}
        totp:
          type: object
          required: [algorithm, digits, period, secret_base32, otpauth_uri, qr]
          properties:
            algorithm: {type: string, const: SHA1}
            digits: {type: integer, const: 6}
            period: {type: integer, const: 30}
            secret_base32: {type: string, pattern: '^[A-Z2-7]{32}$'}
            otpauth_uri: {type: string, maxLength: 512}
            qr:
              type: object
              required: [size, rows]
              properties:
                size: {type: integer, minimum: 21, maximum: 177}
                rows:
                  type: array
                  minItems: 21
                  maxItems: 177
                  items: {type: string, pattern: '^[01]{21,177}$'}
        expires_at: {$ref: '#/components/schemas/Timestamp'}
      allOf:
        - if: {properties: {mode: {enum: [create, reset]}}}
          then: {required: [password]}
          else: {not: {required: [password]}}
    BreakGlassEnrollmentComplete:
      type: object
      additionalProperties: false
      required: [totp_code]
      properties:
        totp_code: {type: string, pattern: '^[0-9]{6}$', maxLength: 6}
    SetupRequest:
      type: object
      additionalProperties: false
      required: [setup_token, username, display_name]
      properties:
        setup_token: {type: string, pattern: '^[A-Za-z0-9_-]{43}$', maxLength: 43}
        username: {$ref: '#/components/schemas/Username'}
        display_name: {$ref: '#/components/schemas/DisplayName'}
    SessionSummary:
      type: object
      required: [session_uid, user_uid, kind, method, created_at, last_activity_at, idle_expires_at, absolute_expires_at]
      properties:
        session_uid: {$ref: '#/components/schemas/Uid'}
        user_uid: {$ref: '#/components/schemas/Uid'}
        kind: {type: string, enum: [sso, break_glass]}
        method: {type: string, enum: [oidc, saml, local]}
        provider_uid: {$ref: '#/components/schemas/Uid'}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        last_activity_at: {$ref: '#/components/schemas/Timestamp'}
        idle_expires_at: {$ref: '#/components/schemas/Timestamp'}
        absolute_expires_at: {$ref: '#/components/schemas/Timestamp'}
        source_address: {type: string, maxLength: 45}
        user_agent: {type: string, maxLength: 256}
    Total:
      type: object
      required: [count, exact]
      properties:
        count: {type: integer, minimum: 0, maximum: 10000}
        exact: {type: boolean}
    SessionPage:
      type: object
      required: [items, total]
      properties:
        items: {type: array, maxItems: 500, items: {$ref: '#/components/schemas/SessionSummary'}}
        next_page_token: {$ref: '#/components/schemas/PageToken'}
        total: {$ref: '#/components/schemas/Total'}
    RevokedCount:
      type: object
      required: [revoked]
      properties:
        revoked: {type: integer, minimum: 0, maximum: 1000}
    ApiToken:
      type: object
      required: [token_uid, name, prefix, owner_user_uid, permissions, created_at, expires_at]
      properties:
        token_uid: {$ref: '#/components/schemas/Uid'}
        name: {$ref: '#/components/schemas/DisplayName'}
        prefix: {type: string, pattern: '^rvt_[A-Za-z0-9_-]{6}$'}
        owner_user_uid: {$ref: '#/components/schemas/Uid'}
        permissions: {type: array, maxItems: 256, items: {$ref: '#/components/schemas/PermissionGrant'}}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        expires_at: {$ref: '#/components/schemas/Timestamp'}
        last_used_at: {$ref: '#/components/schemas/Timestamp'}
        revoked_at: {$ref: '#/components/schemas/Timestamp'}
    ApiTokenCreate:
      type: object
      additionalProperties: false
      required: [name, permissions]
      properties:
        name: {$ref: '#/components/schemas/DisplayName'}
        permissions:
          type: array
          minItems: 1
          maxItems: 256
          uniqueItems: true
          items:
            type: object
            additionalProperties: false
            required: [name]
            properties:
              name: {$ref: '#/components/schemas/PermissionName'}
              device_groups:
                type: array
                minItems: 1
                maxItems: 1024
                uniqueItems: true
                items: {$ref: '#/components/schemas/Uid'}
        expires_at: {$ref: '#/components/schemas/Timestamp'}
    ApiTokenCreated:
      type: object
      required: [token, secret]
      properties:
        token: {$ref: '#/components/schemas/ApiToken'}
        secret: {type: string, pattern: '^rvt_[A-Za-z0-9_-]{43}$'}
    ApiTokenPage:
      type: object
      required: [items, total]
      properties:
        items: {type: array, maxItems: 500, items: {$ref: '#/components/schemas/ApiToken'}}
        next_page_token: {$ref: '#/components/schemas/PageToken'}
        total: {$ref: '#/components/schemas/Total'}
    IdentityProvider:
      type: object
      required: [etag, uid, revision, display_name, protocol, enabled, created_at, updated_at]
      properties:
        etag: {type: string, pattern: '^"r[1-9][0-9]{0,18}"$', maxLength: 22}
        uid: {$ref: '#/components/schemas/Uid'}
        revision: {type: integer, minimum: 1}
        display_name: {$ref: '#/components/schemas/DisplayName'}
        protocol: {type: string, enum: [oidc, saml]}
        enabled: {type: boolean}
        oidc:
          type: object
          required: [issuer, client_id, client_auth_method, has_client_secret, redirect_uri, scopes, allowed_signing_algs]
          properties:
            issuer: {type: string, maxLength: 2048}
            client_id: {type: string, maxLength: 512}
            client_auth_method: {type: string, enum: [client_secret_basic, client_secret_post]}
            has_client_secret: {type: boolean}
            client_secret_set_at: {$ref: '#/components/schemas/Timestamp'}
            redirect_uri: {type: string, maxLength: 2048}
            scopes: {type: array, maxItems: 16, items: {type: string, maxLength: 64}}
            allowed_signing_algs: {type: array, maxItems: 10, items: {$ref: '#/components/schemas/JwsAlgorithm'}}
            iss_parameter_supported: {type: boolean}
        saml:
          type: object
          required: [idp_entity_id, sso_url, idp_certificates, sp_entity_id, acs_url, sp_certificate_sha256, sign_authn_requests, clock_skew_seconds]
          properties:
            idp_entity_id: {type: string, maxLength: 1024}
            sso_url: {type: string, maxLength: 2048}
            idp_certificates:
              type: array
              maxItems: 4
              items:
                type: object
                required: [sha256, not_after]
                properties:
                  sha256: {$ref: '#/components/schemas/Sha256'}
                  not_after: {$ref: '#/components/schemas/Timestamp'}
            sp_entity_id: {type: string, maxLength: 2048}
            acs_url: {type: string, maxLength: 2048}
            sp_certificate_sha256: {$ref: '#/components/schemas/Sha256'}
            sign_authn_requests: {type: boolean}
            clock_skew_seconds: {type: integer, minimum: 0, maximum: 180}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        updated_at: {$ref: '#/components/schemas/Timestamp'}
    JwsAlgorithm:
      type: string
      enum: [RS256, RS384, RS512, PS256, PS384, PS512, ES256, ES384, ES512, EdDSA]
    IdentityProviderInput:
      oneOf:
        - {$ref: '#/components/schemas/OidcProviderInput'}
        - {$ref: '#/components/schemas/SamlProviderInput'}
    OidcProviderInput:
      type: object
      additionalProperties: false
      required: [protocol, display_name, enabled, issuer, client_id, client_auth_method, justification]
      properties:
        justification: {$ref: '#/components/schemas/Justification'}
        protocol: {type: string, const: oidc}
        display_name: {$ref: '#/components/schemas/DisplayName'}
        enabled: {type: boolean}
        issuer: {type: string, pattern: '^https://[^?#\s]{1,2040}$', maxLength: 2048}
        client_id: {type: string, minLength: 1, maxLength: 512}
        client_auth_method: {type: string, enum: [client_secret_basic, client_secret_post]}
        client_secret: {type: string, minLength: 1, maxLength: 1024, writeOnly: true, description: Omit on update to keep the stored secret.}
        extra_scopes:
          type: array
          maxItems: 2
          uniqueItems: true
          items: {type: string, enum: [profile, email]}
        allowed_signing_algs:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items: {$ref: '#/components/schemas/JwsAlgorithm'}
    SamlProviderInput:
      type: object
      additionalProperties: false
      required: [protocol, display_name, enabled, idp_metadata_xml, justification]
      properties:
        justification: {$ref: '#/components/schemas/Justification'}
        protocol: {type: string, const: saml}
        display_name: {$ref: '#/components/schemas/DisplayName'}
        enabled: {type: boolean}
        idp_metadata_xml: {type: string, minLength: 1, maxLength: 262144}
        clock_skew_seconds: {type: integer, minimum: 0, maximum: 180, default: 60}
    IdentityProviderPage:
      type: object
      required: [items, total]
      properties:
        items: {type: array, maxItems: 500, items: {$ref: '#/components/schemas/IdentityProvider'}}
        next_page_token: {$ref: '#/components/schemas/PageToken'}
        total: {$ref: '#/components/schemas/Total'}
    PrincipalKey:
      type: object
      required: [protocol, issuer]
      allOf:
        - if: {properties: {protocol: {const: oidc}}}
          then:
            required: [subject]
            not: {anyOf: [{required: [name_id]}, {required: [name_id_format]}]}
          else:
            required: [name_id, name_id_format]
            not: {required: [subject]}
      properties:
        protocol: {type: string, enum: [oidc, saml]}
        issuer: {type: string, minLength: 1, maxLength: 2048}
        subject: {type: string, minLength: 1, maxLength: 255, description: OIDC sub.}
        name_id_format: {type: string, const: 'urn:oasis:names:tc:SAML:2.0:nameid-format:persistent'}
        name_id: {type: string, minLength: 1, maxLength: 256}
    PrincipalLink:
      type: object
      required: [etag, link_uid, revision, user_uid, provider_uid, principal_key, created_at]
      properties:
        etag: {type: string, pattern: '^"r[1-9][0-9]{0,18}"$', maxLength: 22}
        link_uid: {$ref: '#/components/schemas/Uid'}
        revision: {type: integer, minimum: 1}
        user_uid: {$ref: '#/components/schemas/Uid'}
        provider_uid: {$ref: '#/components/schemas/Uid'}
        principal_key: {$ref: '#/components/schemas/PrincipalKey'}
        created_at: {$ref: '#/components/schemas/Timestamp'}
    PrincipalLinkPage:
      type: object
      required: [items, total]
      properties:
        items: {type: array, maxItems: 500, items: {$ref: '#/components/schemas/PrincipalLink'}}
        next_page_token: {$ref: '#/components/schemas/PageToken'}
        total: {$ref: '#/components/schemas/Total'}
    PrincipalLinkRequest:
      type: object
      required: [request_uid, provider_uid, principal_key, first_seen_at, last_seen_at, expires_at]
      properties:
        request_uid: {$ref: '#/components/schemas/Uid'}
        provider_uid: {$ref: '#/components/schemas/Uid'}
        principal_key: {$ref: '#/components/schemas/PrincipalKey'}
        claimed_display_name: {type: string, maxLength: 128}
        claimed_email: {type: string, maxLength: 320}
        first_seen_at: {$ref: '#/components/schemas/Timestamp'}
        last_seen_at: {$ref: '#/components/schemas/Timestamp'}
        expires_at: {$ref: '#/components/schemas/Timestamp'}
    PrincipalLinkRequestPage:
      type: object
      required: [items, total]
      properties:
        items: {type: array, maxItems: 500, items: {$ref: '#/components/schemas/PrincipalLinkRequest'}}
        next_page_token: {$ref: '#/components/schemas/PageToken'}
        total: {$ref: '#/components/schemas/Total'}
    PrincipalLinkCreate:
      type: object
      additionalProperties: false
      required: [link_request_uid, user_uid, justification]
      properties:
        justification: {$ref: '#/components/schemas/Justification'}
        link_request_uid: {$ref: '#/components/schemas/Uid'}
        user_uid: {$ref: '#/components/schemas/Uid'}
    BreakGlassAccount:
      type: object
      required: [etag, account_uid, revision, user_uid, username, state, created_at]
      properties:
        etag: {type: string, pattern: '^"r[1-9][0-9]{0,18}"$', maxLength: 22}
        account_uid: {$ref: '#/components/schemas/Uid'}
        revision: {type: integer, minimum: 1}
        user_uid: {$ref: '#/components/schemas/Uid'}
        username: {$ref: '#/components/schemas/Username'}
        state: {type: string, enum: [pending_enrollment, active, disabled]}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        enrolled_at: {$ref: '#/components/schemas/Timestamp'}
        last_login_at: {$ref: '#/components/schemas/Timestamp'}
    BreakGlassAccountPage:
      type: object
      required: [items, total]
      properties:
        items: {type: array, maxItems: 500, items: {$ref: '#/components/schemas/BreakGlassAccount'}}
        next_page_token: {$ref: '#/components/schemas/PageToken'}
        total: {$ref: '#/components/schemas/Total'}
    BreakGlassAccountCreate:
      type: object
      additionalProperties: false
      required: [user_uid, username, justification]
      properties:
        user_uid: {$ref: '#/components/schemas/Uid'}
        justification: {$ref: '#/components/schemas/Justification'}
        username: {$ref: '#/components/schemas/Username'}
    EnrollmentCodeClaim:
      type: object
      required: [account_uid, enrollment_code, expires_at]
      properties:
        account_uid: {$ref: '#/components/schemas/Uid'}
        enrollment_code: {type: string, pattern: '^[A-Z2-7]{26}$'}
        expires_at: {$ref: '#/components/schemas/Timestamp'}
    ApprovalRequest:
      type: object
      required: [request_uid, kind, status, action, requester_user_uid, binding_hash, targets_count, created_at, expires_at]
      properties:
        request_uid: {$ref: '#/components/schemas/Uid'}
        kind: {type: string, enum: [access_policy, identity_authority]}
        status: {type: string, enum: [pending, approved, rejected, expired, stale, applied, failed, recovery_pending]}
        action: {type: string, pattern: '^[a-z][A-Za-z0-9]{2,63}$', description: The operationId that created the request.}
        requester_user_uid: {$ref: '#/components/schemas/Uid'}
        binding_hash: {$ref: '#/components/schemas/Sha256'}
        targets_count: {type: integer, minimum: 0}
        justification: {type: string, maxLength: 2000}
        decided_by_user_uid: {$ref: '#/components/schemas/Uid'}
        decided_at: {$ref: '#/components/schemas/Timestamp'}
        decision_method: {$ref: '#/components/schemas/AuthMethodRef'}
        created_at: {$ref: '#/components/schemas/Timestamp'}
        expires_at: {$ref: '#/components/schemas/Timestamp'}
    ApprovalRequestPage:
      type: object
      required: [items, total]
      properties:
        items: {type: array, maxItems: 500, items: {$ref: '#/components/schemas/ApprovalRequest'}}
        next_page_token: {$ref: '#/components/schemas/PageToken'}
        total: {$ref: '#/components/schemas/Total'}
    Justification:
      type: string
      minLength: 1
      maxLength: 2000
    JustificationRequest:
      type: object
      additionalProperties: false
      required: [justification]
      properties:
        justification: {$ref: '#/components/schemas/Justification'}
    ApprovalTarget:
      type: object
      required: [resource_kind, uid, before_hash, after_hash, before_view, after_view]
      properties:
        resource_kind: {type: string, maxLength: 64}
        uid: {$ref: '#/components/schemas/Uid'}
        before_hash: {oneOf: [{$ref: '#/components/schemas/Sha256'}, {type: 'null'}]}
        after_hash: {oneOf: [{$ref: '#/components/schemas/Sha256'}, {type: 'null'}]}
        before_view: {type: [string, 'null'], maxLength: 262144, description: Canonical sanitized JSON matching the resource read schema; null means absent.}
        after_view: {type: [string, 'null'], maxLength: 262144, description: Canonical sanitized JSON matching the resource read schema; no secret or write-only fields.}
    ApprovalTargetPage:
      type: object
      required: [binding_hash, items, total]
      properties:
        binding_hash: {$ref: '#/components/schemas/Sha256'}
        items: {type: array, maxItems: 500, items: {$ref: '#/components/schemas/ApprovalTarget'}}
        next_page_token: {$ref: '#/components/schemas/PageToken'}
        total: {$ref: '#/components/schemas/Total'}
    ApprovalDecision:
      type: object
      additionalProperties: false
      required: [comment, binding_hash]
      properties:
        comment: {type: string, minLength: 1, maxLength: 2000}
        binding_hash: {$ref: '#/components/schemas/Sha256'}
    ChangeToken:
      type: string
      pattern: '^[A-Za-z0-9_-]{21}[AQgw]$'
    ChangeSnapshot:
      type: object
      required: [stream_uid, topics]
      properties:
        stream_uid: {$ref: '#/components/schemas/Uid'}
        topics:
          type: array
          maxItems: 16
          items: {$ref: '#/components/schemas/ChangeEvent'}
    ChangeEvent:
      type: object
      required: [topic, token]
      properties:
        topic: {$ref: '#/components/schemas/Topic'}
        token: {$ref: '#/components/schemas/ChangeToken'}
    SessionEvent:
      type: object
      required: [state]
      properties:
        state: {type: string, enum: [changed, ended]}
    ReconnectEvent:
      type: object
      required: [reason]
      properties:
        reason: {type: string, enum: [shutdown, lifetime, database]}
